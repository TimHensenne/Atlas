# À placer dans ton dépôt sous : .github/workflows/deploy-pages.yml
# Publie le dossier public/ sur GitHub Pages. Se redéclenche :
#  - à chaque push sur main (tes modifications),
#  - après le workflow « Mise à jour des données Atlas » (les données live),
#    uniquement s'il a réussi,
#  - manuellement (bouton Run workflow).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Mise à jour des données Atlas"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois. cancel-in-progress: true → si un nouveau push
# arrive pendant qu'un déploiement tourne, l'ancien est ANNULÉ plutôt que mis en
# file d'attente. Fini les embouteillages qui finissent en "Timeout reached".
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Si on est déclenché par la mise à jour des données, ne déployer que si
    # elle a réussi (sinon on republierait pour rien). Les autres déclencheurs
    # (push, manuel) déploient toujours.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public          # ← on publie le contenu de public/
      - id: deployment
        uses: actions/deploy-pages@v4
