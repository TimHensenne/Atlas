# À placer dans ton dépôt sous : .github/workflows/deploy-pages.yml
# Publie le dossier public/ sur GitHub Pages. Se redéclenche :
#  - à chaque push sur main (tes modifications),
#  - après le workflow « Mise à jour des données Atlas » (les données live),
#  - manuellement (bouton Run workflow).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Mise à jour des données Atlas"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public          # ← on publie le contenu de public/
      - id: deployment
        uses: actions/deploy-pages@v4
