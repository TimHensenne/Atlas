# À placer dans ton dépôt sous : .github/workflows/update-atlas-data.yml
# Régénère TOUTES les données d'Atlas (FMI + fiches pays…) sans serveur.
# Pour ajouter une source à l'avenir : crée fetch-XXX.mjs (qui écrit dans
# public/), puis ajoute « && node fetch-XXX.mjs » au script "data" du
# package.json. Ce workflow n'a JAMAIS besoin d'être modifié.
name: Mise à jour des données Atlas

on:
  schedule:
    - cron: "0 6 1 * *"     # le 1er de chaque mois à 06:00 UTC
  workflow_dispatch: {}      # + bouton « Run workflow » manuel

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Régénérer toutes les données
        run: npm run data

      - name: Committer si une donnée a changé
        run: |
          git config user.name  "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: maj des données (auto)"
          git push
