  const flagUrl = (iso) => `https://cdn.jsdelivr.net/npm/flag-icons@7/flags/4x3/${String(iso).toLowerCase()}.svg`;
  // Grille 2×2 : une tuile illustrée par jeu.

function homeReveal(){
  const host = el("view-home");
  const els = [...host.querySelectorAll(".reveal")];
  if (!("IntersectionObserver" in window)){ els.forEach(x => x.classList.add("vis")); }
  else {
    const io = new IntersectionObserver((ents) => {
      for (const en of ents) if (en.isIntersecting){ en.target.classList.add("vis"); io.unobserve(en.target); }
    }, { root: host.querySelector(".home-page"), threshold: 0, rootMargin: "0px 0px 14% 0px" });
    // Ce qui est DÉJÀ dans l'écran au chargement s'affiche tout de suite, sans
    // fondu (sinon il « pop » une frame trop tard, comme mal chargé) ; le reste
    // est révélé à l'approche.
    const vh = window.innerHeight || 800;
    for (const x of els){
      const r = x.getBoundingClientRect();
      if (r.top < vh * 0.92) x.classList.add("vis", "instant");
      else io.observe(x);
    }
  }
  initGlobe();        // no-op tant que le trait de côte n'est pas chargé
  heroMagnet();
  homeBento();
}
// Aperçus réels de la grille bento : mini-carte dessinée une fois,
// taux EUR/USD-GBP-JPY récupérés en direct.
function homeBento(){
  const host = el("view-home");
  const cv = host.querySelector(".bm-canvas");
  if (cv && !cv.dataset.on){
    const draw = () => {
      if (!GLOBE_LAND) return false;
      cv.dataset.on = "1";
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = cv.parentElement.clientWidth || 380, H = 150;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      const ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const proj = d3.geoNaturalEarth1().fitExtent([[4, 4], [W - 4, H - 4]], { type: "Sphere" });
      const p = d3.geoPath(proj, ctx);
      ctx.beginPath(); for (const f of GLOBE_LAND) p(f);
      ctx.fillStyle = themeVar("--land"); ctx.fill();
      // Points posés sur de VRAIES terres : on projette 3 lieux répartis
      // (Amérique du Nord, Europe, Asie de l'Est) et on place les pastilles
      // en pourcentage — elles restent alignées si la carte est redimensionnée.
      const spots = [[-98, 39], [10, 50], [138, 37]];   // [lon, lat]
      const dots = cv.parentElement.querySelectorAll(".bm-dot");
      spots.forEach((c, i) => { const xy = proj(c); const d = dots[i];
        if (xy && d){ d.style.left = (xy[0] / W * 100).toFixed(1) + "%";
          d.style.top = (xy[1] / H * 100).toFixed(1) + "%"; } });
      return true;
    };
    if (!draw()){ loadGlobeLand(); const iv = setInterval(() => { if (draw()) clearInterval(iv); }, 250);
      setTimeout(() => clearInterval(iv), 6000); }
  }
  const pairs = host.querySelectorAll("[data-bfx]");
  if (pairs.length) fxvLoad("EUR").then(d => {
    if (!d || !d.map) return;
    for (const p of pairs){ const r = d.map[p.dataset.bfx.toLowerCase()];
      if (r != null) p.querySelector("b").textContent = r.toFixed(p.dataset.bfx === "JPY" ? 1 : 4); }
  });
}

// Convertisseur libre (toutes devises de l'API) + grandes paires vs EUR/USD.
// Taux via la même API que les fiches pays (exchange-api, sans clé).
let fxvFrom = "EUR", fxvTo = "USD", fxvAmt = "100";
const fxvBase = {};                    // cache : devise base → { date, map } (tous les taux)
const FXV_MAJORS = ["USD","EUR","GBP","JPY","CHF","CNY","CAD","AUD","NZD","SEK","NOK","DKK","PLN","CZK","HUF","TRY","INR","KRW","BRL","MXN","ZAR"];
// Nom des devises depuis countries.json (« Euro (EUR) » → « Euro »), dédupliqué.
// Évalué à la demande : `ident` n'est rempli qu'après le chargement des données.
let fxvNamesFor = null, fxvNamesMap = {};
function fxvName(c){
  if (fxvNamesFor !== lang){ fxvNamesMap = {};
    for (const iso of Object.keys(ident)){ const d = ident[iso];
      if (d && d.code && !fxvNamesMap[d.code]){ const raw = (lang === "fr" ? d.curFr : d.cur) || d.cur || "";
        fxvNamesMap[d.code] = raw.replace(/\s*\([A-Z]{3}\)\s*$/, "") || d.code; } }
    fxvNamesFor = lang; }
  return fxvNamesMap[c] || c;
}
async function fxvLoad(base){
  const lc = String(base).toLowerCase();
  if (fxvBase[base]) return fxvBase[base];
  fxvBase[base] = { loading: true };
  try { const j = await fxGet("latest", lc, true);
    const map = j && j[lc];
    if (!map) throw new Error();
    fxvBase[base] = { date: j.date, map };
  } catch { fxvBase[base] = { error: true }; }
  return fxvBase[base];
}
function fxvOptions(sel){
  const codes = new Set(FXV_MAJORS);
  Object.values(ident).forEach(d => { if (d && d.code) codes.add(d.code); });
  return [...codes].sort((a, b) => {
    const ia = FXV_MAJORS.indexOf(a), ib = FXV_MAJORS.indexOf(b);
    if (ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return a.localeCompare(b);
  }).map(c => `<option value="${c}"${c === sel ? " selected" : ""}>${c}${fxvName(c) !== c ? " — " + esc(fxvName(c)) : ""}</option>`).join("");
}
// Met à jour le CONVERTISSEUR seul (sélecteurs, résultat, ligne de taux) sans
// re-render le tableau : son défilement n'est donc jamais réinitialisé.
function fxvUpdate(){
  const L = lang === "fr";
  const host = el("view-fx"); if (!host) return;
  const selFrom = host.querySelector("#fxv-from"), selTo = host.querySelector("#fxv-to");
  if (selFrom) selFrom.value = fxvFrom;
  if (selTo) selTo.value = fxvTo;
  const d = fxvBase[fxvFrom];
  const a = parseFloat(String(fxvAmt).replace(",", "."));
  const nf = new Intl.NumberFormat(L ? "fr-BE" : "en-GB", { maximumFractionDigits: 4 });
  const r = d && d.map ? (fxvFrom === fxvTo ? 1 : d.map[fxvTo.toLowerCase()]) : null;
  const out = host.querySelector(".fxv-res b");
  if (out) out.textContent = (d && d.error) ? (L ? "indisponible" : "unavailable")
    : (isFinite(a) && a > 0 && r != null) ? nf.format(a * r) + " " + fxvTo : "—";
  const unit = host.querySelector(".fxv-unit");
  if (unit) unit.textContent = (r != null && fxvFrom !== fxvTo)
    ? `1 ${fxvFrom} = ${nf.format(r)} ${fxvTo}${d && d.date ? " · " + d.date : ""}` : "";
  // Charge la base manquante si besoin, puis rafraîchit le convertisseur seul.
  if (!fxvBase[fxvFrom]) fxvLoad(fxvFrom).then(() => { if (view === "fx") fxvUpdate(); });
}

// A = A- et mieux · B = BBB+ à B- · C = CCC+ et moins (défauts compris).
function gradeOf(iso){
  const r = ratings.countries?.[iso]; if (!r) return null;
  const rank = r.sp != null ? RANK_SPF[r.sp]
    : r.fitch != null ? RANK_SPF[r.fitch]
    : r.moody != null ? RANK_MOODY[r.moody] : null;
  if (rank == null) return null;
  return rank >= 15 ? "A" : rank >= 6 ? "B" : "C";
}

function renderTableBody(){
  const cols = DB_COLS.filter(c => c.always || dbVisible.has(c.key));
  const toggleable = DB_COLS.filter(c => !c.always);
  const allBtn = `<button class="db-all" data-dbreset title="${lang === "fr" ? "Tout réafficher, vider recherche et épingles" : "Show all, clear search and pins"}">⟳ ${lang === "fr" ? "Réinitialiser" : "Reset"}</button>`;
  const toggles = toggleable.map(c =>
    `<label class="db-chk"><input type="checkbox" data-col="${c.key}"${dbVisible.has(c.key) ? " checked" : ""}>${esc(c.t[lang])}</label>`
  ).join("");
  const sortCol = DB_COLS.find(c => c.key === dbSort) || DB_COLS[0];
  const rankOf = (c, v) => c.rank ? (c.rank[v] ?? -1) : v;
  const isos = Object.keys(macro.countries || {}).sort((a, b) => {
    let va = sortCol.get(a), vb = sortCol.get(b);
    const na = va == null || va === "", nb = vb == null || vb === "";
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;   // manquants en bas
    if (sortCol.text) return String(va).localeCompare(String(vb), lang) * dbDir;
    return (rankOf(sortCol, va) - rankOf(sortCol, vb)) * dbDir;
  });
  const arrow = dbDir < 0 ? " ↓" : " ↑";
  // Filtre de recherche : compare sans accents, sur le nom affiché.
  const fold = (s) => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const q = fold(dbQuery.trim());
  const nameCol = DB_COLS[0];
  // Filtres : OU au sein d'un groupe, ET entre groupes. Épinglés toujours visibles.
  const passRegion = (iso) => !dbRegions.size || dbRegions.has(ident[iso]?.reg);
  const passGrade  = (iso) => !dbGrades.size || dbGrades.has(gradeOf(iso));
  let quartOf = null;
  if (dbQInd && dbQuarts.size){
    const col = DB_COLS.find(c => c.key === dbQInd);
    const vals = isos.map(i => col.get(i)).filter(v => v != null && v !== "").sort((a, b) => a - b);
    if (vals.length >= 4){
      const at = (p) => vals[Math.min(vals.length - 1, Math.floor(p * vals.length))];
      const t1 = at(.25), t2 = at(.5), t3 = at(.75);
      quartOf = (iso) => { const v = col.get(iso); if (v == null || v === "") return null;
        return v <= t1 ? 1 : v <= t2 ? 2 : v <= t3 ? 3 : 4; };
    }
  }
  const passQuart = (iso) => !quartOf || dbQuarts.has(quartOf(iso));
  const shown = isos.filter(iso => dbPicked.has(iso)
    || ((!q || fold(nameCol.get(iso)).includes(q) || iso.toLowerCase() === q)
        && passRegion(iso) && passGrade(iso) && passQuart(iso)));
  // Puces de filtres
  const chip = (attr, val, on, label, dis) =>
    `<button class="chip${on ? " on" : ""}" ${attr}="${val}"${dis ? " disabled" : ""}>${label}</button>`;

      : "Sources: IMF (macro) · World Bank (population) · world-countries (region) · OECD via FRED (yields) · Wikipedia (ratings)"}</div>`;
}
// Graduations « rondes », en visant au plus n intervalles (pas 1/2/2,5/5/10 ×10ⁿ).
function niceTicks(min, max, n){
  const span = (max - min) || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const cand = [1, 2, 2.5, 5, 10].map(s => s * mag);
  const step = cand.find(s => span / s <= n) || cand[cand.length - 1];
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-6; v += step) out.push(+v.toFixed(6));
  return out;
}

// Unité et format des graduations de l'axe Y. Renvoie { label, fmtTick } : une
// seule unité pour tout l'axe (affichée en étiquette), les graduations n'étant
// alors que des nombres. Les valeurs pleines restent dans l'infobulle.
function yAxisUnit(fmt, ticks){
  const fr = lang === "fr";
  const dec = (s) => fr ? s.replace(".", ",") : s;
  if (fmt !== "moneyMd" && fmt !== "money"){
    return { label: "%", fmtTick: (v) => v % 1 ? dec(v.toFixed(1)) : String(v) };
  }
  const rate = macro.fx?.usdToEur;
  const sym = (currency === "EUR" && rate) ? "€" : "$";
  const nativeMul = fmt === "moneyMd" ? 1e9 : 1;              // → USD
  const eurMul = (currency === "EUR" && rate) ? rate : 1;
  const toDisp = (v) => v * nativeMul * eurMul;              // valeur affichée (USD/EUR)
  const maxAbs = Math.max(...ticks.map(t => Math.abs(toDisp(t))), 1);
  let div, u;
  if (maxAbs >= 1e12){ div = 1e12; u = "T " + sym; }
  else if (maxAbs >= 1e9){ div = 1e9; u = (fr ? "Md" : "B") + " " + sym; }
  else if (maxAbs >= 1e6){ div = 1e6; u = "M " + sym; }
  else if (maxAbs >= 1e3){ div = 1e3; u = "k " + sym; }
  else { div = 1; u = sym; }
  return { label: u, fmtTick: (v) => { const x = toDisp(v) / div; return x % 1 ? dec(x.toFixed(1)) : String(x); } };
}

// Graphe comparateur : superpose les trajectoires annuelles de plusieurs pays
// sur un même indicateur. SVG à repère fixe (axes valeurs + années), une courbe
// par pays, survol pour lire toutes les valeurs d'une année. Les colonnes
// (année → valeurs par série) sont stockées sur le SVG pour le survol.
function compareChart(isos, key, fmt, vbH){
  const series = isos.slice(0, SERIES_COLORS.length).map((iso, idx) => {
    const d = macro.countries[iso].indicators[key];
    const y0 = d.hist0;
    const pts = d.hist.map((v, i) => [y0 + i, v]).filter(([, v]) => typeof v === "number" && isFinite(v));
    return { iso, name: (lang === "en" && NAME_EN[iso]) ? NAME_EN[iso] : macro.countries[iso].name,
             color: SERIES_COLORS[idx], pts };
  }).filter(s => s.pts.length);
  if (!series.length) return "";
  let xMin = Infinity, xMax = -Infinity, vMin = Infinity, vMax = -Infinity;
  series.forEach(s => s.pts.forEach(([yr, v]) => {
    if (yr < xMin) xMin = yr; if (yr > xMax) xMax = yr;
    if (v < vMin) vMin = v; if (v > vMax) vMax = v;
  }));
  if (xMin === xMax) xMax = xMin + 1;
  let y0 = vMin, y1 = vMax;
  if (y0 === y1){ y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  const zeroIn = y0 < 0 && y1 > 0;
  const W = 1000, H = Math.max(240, Math.round(vbH || 340)), mL = 66, mR = 22, mT = 30, mB = 48;
  const pw = W - mL - mR, ph = H - mT - mB;
  const sx = yr => mL + (yr - xMin) / ((xMax - xMin) || 1) * pw;
  const sy = v  => mT + (1 - (v - y0) / ((y1 - y0) || 1)) * ph;
  const ticks = niceTicks(y0, y1, 5).filter(tv => tv >= y0 && tv <= y1);
  const yu = yAxisUnit(fmt, ticks);
  const grid = ticks.map(tv => {
    const yy = sy(tv).toFixed(1);
    return `<line class="cmp-grid" x1="${mL}" y1="${yy}" x2="${W - mR}" y2="${yy}"/>`
      + `<text class="cmp-ylab" x="${mL - 9}" y="${yy}" text-anchor="end" dominant-baseline="middle">${esc(yu.fmtTick(tv))}</text>`;
  }).join("");
  const zeroLine = zeroIn ? `<line class="cmp-zero" x1="${mL}" y1="${sy(0).toFixed(1)}" x2="${W - mR}" y2="${sy(0).toFixed(1)}"/>` : "";
  // Axes pleins (cadre en L) + étiquette d'unité de l'axe Y en haut à gauche.
  const axes = `<line class="cmp-axis" x1="${mL}" y1="${mT}" x2="${mL}" y2="${H - mB}"/>`
    + `<line class="cmp-axis" x1="${mL}" y1="${H - mB}" x2="${W - mR}" y2="${H - mB}"/>`;
  const yUnit = `<text class="cmp-unit" x="${mL - 9}" y="${mT - 12}" text-anchor="end">${esc(yu.label)}</text>`;
  const years = []; for (let y = xMin; y <= xMax; y++) years.push(y);
  const step = Math.max(1, Math.round(years.length / 6));
  const xlabs = years.filter((y, i) => i % step === 0 || y === xMax).map(y =>
    `<text class="cmp-xlab" x="${sx(y).toFixed(1)}" y="${H - mB + 20}" text-anchor="middle">${y}</text>`).join("");
  const xTitle = `<text class="cmp-axtitle" x="${((mL + W - mR) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${lang === "fr" ? "Année" : "Year"}</text>`;
  const paths = series.map(s => {
    const d = s.pts.map(([yr, v], k) => (k ? "L" : "M") + sx(yr).toFixed(1) + "," + sy(v).toFixed(1)).join(" ");
    return `<path class="cmp-line" d="${d}" style="stroke:${s.color}"/>`;
  }).join("");
  const ends = series.map(s => { const p = s.pts[s.pts.length - 1];
    return `<circle r="3" cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" style="fill:${s.color}"/>`; }).join("");
  const cols = years.map(y => ({
    year: y, x: +sx(y).toFixed(1),
    vals: series.map((s, si) => { const p = s.pts.find(pp => pp[0] === y);
      return p ? { name: s.name, color: s.color, y: +sy(p[1]).toFixed(1), v: p[1], si } : null; }).filter(Boolean)
  })).filter(c => c.vals.length);
  const hdots = series.map((s, i) => `<circle class="cmp-hdot" data-i="${i}" r="3.5" style="fill:${s.color};display:none"/>`).join("");
  return `<svg class="compare-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-fmt="${fmt}" data-vbw="${W}" data-vbh="${H}" data-cols='${esc(JSON.stringify(cols))}'>
      ${grid}${zeroLine}${axes}
      <line class="cmp-guide" x1="0" y1="${mT}" x2="0" y2="${H - mB}" style="display:none"/>
      ${paths}${ends}${hdots}
      ${yUnit}${xlabs}${xTitle}
    </svg>`;
}

// ── Mode Nuage : scatter tous-pays. X et Y = deux indicateurs au choix,
// taille du point = PIB (échelle racine), teinte = région. Survol : infobulle.
// Même gabarit que le mode Graphique : menus verticaux à gauche, graphe
// encadré (titre inclus) au centre, Légende + Définitions à droite.
const SC_REG_COLORS = { Europe:"#4F6BED", Asia:"#12A594", Africa:"#E0823D", Americas:"#C23B87", Oceania:"#7C4DBE" };
function scatterPoints(){
  const pts = []; let gMax = 0;
  for (const [iso, c] of Object.entries(macro.countries || {})){
    const x = c.indicators?.[scXInd]?.value, y = c.indicators?.[scYInd]?.value,
          g = c.indicators?.NGDPD?.value;
    if ([x, y, g].some(v => v == null || !isFinite(v))) continue;   // tout ou rien
    if (g > gMax) gMax = g;
    pts.push({ iso, name: (lang === "en" && NAME_EN[iso]) ? NAME_EN[iso] : c.name,
               x, y, g, reg: ident[iso]?.reg });
  }
  return { pts, gMax };
}
function scatterChart(vbH){
  const L = lang === "fr";
  const { pts, gMax } = scatterPoints();
  if (pts.length < 5) return `<div class="cmp-empty">${L ? "Données insuffisantes pour ce croisement." : "Not enough data for this pair."}</div>`;
  // Domaines écrêtés aux percentiles 2-98 : sans cela, un cas extrême
  // (hyperinflation…) tasse tous les autres points dans un coin.
  const dom = (arr) => {
    const s = [...arr].sort((a, b) => a - b);
    const lo = s[Math.floor(s.length * 0.02)], hi = s[Math.ceil(s.length * 0.98) - 1];
    const pad = (hi - lo || 1) * 0.06;
    return [lo - pad, hi + pad];
  };
  const [x0, x1] = dom(pts.map(p => p.x)), [y0, y1] = dom(pts.map(p => p.y));
  const W = 1000, H = Math.max(240, Math.round(vbH || 420)), mL = 68, mR = 20, mT = 16, mB = 50;
  const pw = W - mL - mR, ph = H - mT - mB;
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const sx = v => mL + (cl(v, x0, x1) - x0) / ((x1 - x0) || 1) * pw;
  const sy = v => mT + (1 - (cl(v, y0, y1) - y0) / ((y1 - y0) || 1)) * ph;
  const xt = niceTicks(x0, x1, 6).filter(v => v >= x0 && v <= x1);
  const yt = niceTicks(y0, y1, 5).filter(v => v >= y0 && v <= y1);
  const xu = yAxisUnit(CHART_FMT[scXInd], xt), yu = yAxisUnit(CHART_FMT[scYInd], yt);
  const grid = yt.map(v => `<line class="cmp-grid" x1="${mL}" y1="${sy(v).toFixed(1)}" x2="${W - mR}" y2="${sy(v).toFixed(1)}"/>`
      + `<text class="cmp-ylab" x="${mL - 9}" y="${sy(v).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${esc(yu.fmtTick(v))}</text>`).join("")
    + xt.map(v => `<text class="cmp-xlab" x="${sx(v).toFixed(1)}" y="${H - mB + 20}" text-anchor="middle">${esc(xu.fmtTick(v))}</text>`).join("");
  // Axes CENTRÉS : ils se croisent aux médianes mondiales des deux indicateurs
  // (lecture en quadrants : au-dessus/en-dessous du pays « typique »). La ligne
  // de zéro reste en pointillé quand le domaine traverse le négatif.
  const med = (arr) => { const s = [...arr].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const medX = med(pts.map(p => p.x)), medY = med(pts.map(p => p.y));
  const cx = sx(medX), cy = sy(medY);
  const zeroX = (y0 < 0 && y1 > 0) ? `<line class="cmp-zero" x1="${mL}" y1="${sy(0).toFixed(1)}" x2="${W - mR}" y2="${sy(0).toFixed(1)}"/>` : "";
  const zeroY = (x0 < 0 && x1 > 0) ? `<line class="cmp-zero" x1="${sx(0).toFixed(1)}" y1="${mT}" x2="${sx(0).toFixed(1)}" y2="${H - mB}"/>` : "";
  const axes = `<line class="cmp-axis sc-axis-c" x1="${mL}" y1="${cy.toFixed(1)}" x2="${W - mR}" y2="${cy.toFixed(1)}"/>`
    + `<line class="cmp-axis sc-axis-c" x1="${cx.toFixed(1)}" y1="${mT}" x2="${cx.toFixed(1)}" y2="${H - mB}"/>`;
  const axU = (u) => u.label === "%" ? "%" : u.label;
  const titles = `<text class="cmp-axtitle" x="${((mL + W - mR) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(IND_LABELS[scXInd]?.[lang] || scXInd)} (${esc(axU(xu))})</text>`
    + `<text class="cmp-yunit" x="${mL - 9}" y="${mT - 2}" text-anchor="end">${esc(axU(yu))}</text>`;
  // Taille : aire ∝ PIB (rayon en racine), bornée pour rester lisible.
  const rOf = g => 2.5 + 12.5 * Math.sqrt(g / gMax);
  // Gros PIB dessinés d'abord (dessous), petits au-dessus → tous survolables.
  pts.sort((a, b) => b.g - a.g);
  const dots = pts.map(p => `<circle class="sc-dot" data-iso="${p.iso}" data-name="${esc(p.name)}" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${rOf(p.g).toFixed(1)}" style="fill:${SC_REG_COLORS[p.reg] || "#8A93A8"}"/>`).join("");
  return `<svg class="scatter-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${grid}${zeroX}${zeroY}${axes}${dots}${titles}
    </svg>`;
}

const todayKey = () => { const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const seedHash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// Tire un pays du jour, déterministe : « sel » distinct → pays distinct par jeu.
const dailyPick = (pool, salt = "") => pool.length ? pool[seedHash(salt + todayKey()) % pool.length] : null;

const serieRead = () => { try { const j = JSON.parse(localStorage.getItem("atlas-serie") || "null");

// ── Classement local (palmarès des séries terminées) ─────────────────────
// Site statique : pas de serveur, donc pas de classement partagé entre
// visiteurs. On garde un palmarès LOCAL à ce navigateur — les meilleures
// séries (total d'essais le plus faible), une entrée par jour (la meilleure).
const scoreRead = () => { try { const a = JSON.parse(localStorage.getItem("atlas-scores") || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } };
const scoreWrite = (a) => { try { localStorage.setItem("atlas-scores", JSON.stringify(a.slice(0, 50))); } catch {} };
function serieRecord(){
  const games = serieRead();
  if (SERIE.some(g => !games[g])) return;                         // série incomplète
  const total = SERIE.reduce((s, g) => s + (games[g]?.tries || 0), 0);
  const day = todayKey();
  const scores = scoreRead();
  const ex = scores.find(s => s.date === day);
  if (ex) ex.total = Math.min(ex.total, total);                    // garde la meilleure du jour
  else scores.push({ date: day, total });
  scores.sort((a, b) => a.total - b.total || (a.date < b.date ? -1 : 1));
  scoreWrite(scores);
}

const gName = (iso) => (lang === "en" && NAME_EN[iso]) ? NAME_EN[iso] : macro.countries?.[iso]?.name || iso;
const gDensity = (iso) => { const d = ident[iso]; return d && d.pop != null && d.area ? d.pop / d.area : null; };
// Direction du pays mystère vue depuis l'essai : flèche parmi 8 (↑ = nord).
function gDirection(from, to){
  if (!from || !to || from.lat == null || to.lat == null) return null;
  const dx = ((to.lng - from.lng + 540) % 360) - 180;   // écart de longitude, borné à ±180
  const dy = to.lat - from.lat;
  const deg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;   // 0 = nord, 90 = est
  return ["↑","↗","→","↘","↓","↙","←","↖"][Math.round(deg / 45) % 8];
}
function gPool(){
  return Object.keys(macro.countries || {}).filter(iso => {
    const d = ident[iso];
    return d && d.pop != null && d.area && d.reg && d.lat != null && d.bord != null && ind(iso, "NGDPD") != null;
  });
}
function gNew(daily){
  const pool = gPool().sort();   // ordre stable → graine quotidienne identique pour tous
  gDaily = !!daily;
  gTarget = daily ? dailyPick(pool) : pool[Math.floor(Math.random() * pool.length)] || null;
  gGuesses.length = 0; gWon = false; gHint = false;
}
// Compare une valeur numérique de l'essai à celle du mystère.
function gCellNum(v, tv, fmt){
  if (v == null || tv == null) return `<div class="g-cell">—</div>`;
  const ratio = tv === 0 ? (v === 0 ? 0 : 1) : Math.abs(v - tv) / Math.abs(tv);
  const cls = v === tv ? " g-ok" : ratio <= .10 ? " g-close" : "";
  const arrow = v === tv ? "" : tv > v ? " ↑" : " ↓";
  return `<div class="g-cell${cls}">${fmt(v)}${arrow}</div>`;
}

// Le petit robot : il cligne des yeux par moments. Au survol de la souris,
// son écran et son antenne s'allument.
let mascotReady = false;
function hubMascot(){
  if (!document.querySelector(".g-mascot")) return;
  if (mascotReady) return;
  mascotReady = true;
  const cur = () => document.querySelector(".g-mascot");
  // Survol : le robot reste fixe, mais son écran et sa boule d'antenne
  // s'allument en rouge (classe .alert) quand le curseur s'approche.
  let raf = null, ev = null;
  document.addEventListener("pointermove", (e) => { ev = e;
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = null;
      const m = cur(); if (!m || getComputedStyle(m).display === "none") return;
      const r = m.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const near = ev.clientX > r.left - 40 && ev.clientX < r.right + 40 &&
                   ev.clientY > r.top - 40 && ev.clientY < r.bottom + 40;
      m.classList.toggle("alert", near);
    });
  }, { passive: true });
  // Clignement pseudo-aléatoire : intervalles variables + double clin parfois.
  const doBlink = (m) => { m.classList.add("blink"); setTimeout(() => m.classList.remove("blink"), 200); };
  const schedule = () => {
    const m = cur(); if (!m){ setTimeout(schedule, 2000); return; }
    doBlink(m);
    if (Math.random() < 0.22) setTimeout(() => { const n = cur(); if (n) doBlink(n); }, 320);
    setTimeout(schedule, 2600 + Math.random() * 3400);   // 2,6–6 s
  };
  setTimeout(schedule, 1400);
}

// Fond « GeoGuessr » : carte du monde en pointillés. On peint les terres sur
// un canvas hors-écran, puis on ne garde qu'un point là où il y a de la terre.
function hubWorldBg(){
  const cv = el("worldbg");
  if (!cv) return;
  if (!GLOBE_LAND){ loadGlobeLand(); setTimeout(hubWorldBg, 200); return; }
  const W = Math.round(window.innerWidth);
  const H = Math.round(window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // La carte remplit largement l'écran, bien centrée (H et V).
  const proj = d3.geoNaturalEarth1();
  proj.fitSize([W, H], { type: "Sphere" });
  proj.scale(proj.scale() * 1.18).translate([W / 2, H / 2]);
  // Masque des terres sur un canvas hors-écran.
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const octx = off.getContext("2d");
  const opath = d3.geoPath(proj, octx);
  octx.beginPath(); for (const f of GLOBE_LAND) opath(f);
  octx.fillStyle = "#000"; octx.fill();
  const mask = octx.getImageData(0, 0, W, H).data;
  // Trame sur toute la fenêtre : points d'océan discrets + points de terre
  // plus marqués → fond rempli partout, continents qui ressortent.
  const step = 7;
  ctx.fillStyle = themeVar("--indigo");
  for (let y = 0; y < H; y += step){
    const dx = (Math.floor(y / step) % 2 ? step / 2 : 0);
    for (let x = 0; x < W; x += step){
      const land = mask[(y * W + x) * 4 + 3] > 40;
      ctx.globalAlpha = land ? 1 : 0.22;
      ctx.beginPath(); ctx.arc(x + dx, y, land ? 1.6 : 1.05, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
// Redessin au redimensionnement (débounce) + au changement de thème.
let worldbgTimer = null;
function worldbgRefresh(){ clearTimeout(worldbgTimer); worldbgTimer = setTimeout(hubWorldBg, 180); }
window.addEventListener("resize", worldbgRefresh);

// Mini-carte monde de la carte « Trouve le pays » (canvas, données réelles).
function hubFx(){
  const cv = el("view-games").querySelector(".gc-map");
  if (!cv || cv.dataset.on) return;
  if (!GLOBE_FEATS){ setTimeout(hubFx, 200); return; }   // données pas encore là → réessaie
  const wrap = cv.parentElement;
  const W = Math.max(120, Math.round(wrap.clientWidth || 260));
  const H = Math.max(60, Math.round(wrap.clientHeight || 96));
  cv.dataset.on = "1";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const proj = d3.geoNaturalEarth1().fitExtent([[6, 6], [W - 6, H - 6]], { type: "Sphere" });
  const path = d3.geoPath(proj, ctx);
  ctx.beginPath();
  for (const f of GLOBE_FEATS) path(f);
  ctx.fillStyle = themeVar("--land-hi") || themeVar("--land"); ctx.fill();
  ctx.strokeStyle = themeVar("--ocean"); ctx.lineWidth = 0.4; ctx.stroke();
}

function gSuggest(qRaw, exclude = gGuesses){

  if (!q) return [];
  return gPool()
    .filter(iso => !exclude.includes(iso))
    .filter(iso => foldG(gName(iso)).includes(q) || iso.toLowerCase() === q)
    .sort((a, b) => {
      const ai = a.toLowerCase() === q ? 0 : 1, bi = b.toLowerCase() === q ? 0 : 1;
      if (ai !== bi) return ai - bi;
      const ap = foldG(gName(a)).startsWith(q) ? 0 : 1, bp = foldG(gName(b)).startsWith(q) ? 0 : 1;
      if (ap !== bp) return ap - bp;
      return gName(a).localeCompare(gName(b), lang);

// Plus grande partie d'un pays : évite qu'un archipel ou un État transcontinental

function largestPart(feature){
  const gm = feature && feature.geometry; if (!gm) return feature;
  if (gm.type === "Polygon") return feature;
  let best = feature, bestA = -1;
  for (const coords of gm.coordinates){
    const pf = { type: "Feature", geometry: { type: "Polygon", coordinates: coords } };
    let a = 0; try { a = d3.geoArea(pf); } catch {}

function gShape(iso){

  try { const [[w], [e]] = d3.geoBounds(f);            // longitudes ouest / est
    if (e < w || (e - w) > 160) feat = largestPart(f); // antiméridien / très étalé
  } catch {}
  const W = 320, H = 200, pad = 14;
  let d = "";
  try {
    const proj = d3.geoMercator().fitExtent([[pad, pad], [W - pad, H - pad]], feat);
    d = d3.geoPath(proj)(feat) || "";
  } catch {}
  if (!d) return "";

function gMask(iso){
  const isL = (ch) => /\p{L}/u.test(ch);
  const masked = gName(iso).split(/(\s+)/).map(tok => {
    if (!tok.trim()) return tok;
    const chars = [...tok];
    const idx = chars.map((ch, i) => isL(ch) ? i : -1).filter(i => i >= 0);
    if (idx.length <= 2) return tok;                    // mots très courts : montrés
    const first = idx[0], last = idx[idx.length - 1];
    return chars.map((ch, i) => !isL(ch) ? ch : (i === first || i === last) ? ch : "_").join("");
  }).join("");
  return [...masked].join("\u2009");                    // espace fine entre chaque signe
}

  { k:"gdp",  fr:"PIB",            en:"GDP",             f:(v,L)=>"$ "+Math.round(v).toLocaleString(L?"fr-BE":"en-GB")+" Md" },
  { k:"gdppc",fr:"PIB par habitant",en:"GDP per capita", f:(v,L)=>"$ "+Math.round(v).toLocaleString(L?"fr-BE":"en-GB") },
  { k:"area", fr:"Superficie",     en:"Area",            f:(v,L)=>Math.round(v).toLocaleString(L?"fr-BE":"en-GB")+" km²" },

function dVal(iso, k){
  const d = ident[iso]; if (!d) return null;

  const m = macro.countries?.[iso]?.indicators;

    const a = pool[Math.floor(rand() * pool.length)];
    const b = pool[Math.floor(rand() * pool.length)];
    if (a === b) continue;
    const va = dVal(a, m.k), vb = dVal(b, m.k);
    if (va == null || vb == null) continue;
    if (Math.max(va, vb) / Math.min(va, vb) < 1.05) continue;

    // ── Quotidien : les 8 duels en LISTE, révélation unique après validation.
    const allPicked = !dPicks.some(p => !p);
    const rows = dQ.map((q, i) => {
      const met = D_METRICS.find(x => x.k === q.m);
      const side = (iso) => {
        const sel = dPicks[i] === iso;
        const cls = dRevealAll
          ? (iso === q.win ? " right" : (sel ? " wrong" : ""))
          : (sel ? " sel" : "");
        return `<button class="dr-side${cls}" data-dsel="${i}:${iso}"${dRevealAll ? " disabled" : ""}>
          <img class="dr-flag" src="https://cdn.jsdelivr.net/npm/flag-icons@7/flags/4x3/${iso.toLowerCase()}.svg" alt="">
          <span class="dr-name">${esc(gName(iso))}</span>
          ${dRevealAll ? `<span class="dr-val">${met.f(dVal(iso, q.m), L)}</span>` : ""}
          ${dRevealAll && iso === q.win ? `<span class="dl-mark ok">✓</span>` : ""}
          ${dRevealAll && iso !== q.win && sel ? `<span class="dl-mark ko">✗</span>` : ""}
        </button>`;
      };
      return `<div class="dr-row${dRevealAll ? (dPicks[i] === q.win ? " ok" : " ko") : ""}">
        <div class="dr-meta"><span class="dr-n">${i + 1}</span><span class="dr-met">${esc(L ? met.fr : met.en)}</span></div>
        <div class="dr-duel">${side(q.a)}<span class="dr-vs">vs</span>${side(q.b)}</div>
      </div>`;
    }).join("");
    const errs = D_LEN - dCorrect;
    const foot = dRevealAll
      ? `<div class="g-banner">${dCorrect === D_LEN ? "🎉" : "🏁"} ${dCorrect} / ${D_LEN} — ${errs === 0
          ? (L ? "sans faute, +0 au score !" : "flawless, +0 to your score!")
          : `+${errs} ${L ? (errs > 1 ? "erreurs" : "erreur") : (errs > 1 ? "errors" : "error")} ${L ? "au score" : "to your score"}`}</div>`
      : `<div class="serie-cont"><button class="hs-cta big" data-dvalidate${allPicked ? "" : " disabled"}>${L ? "Valider mes réponses" : "Submit my answers"} (${dPicks.filter(Boolean).length}/${D_LEN})</button></div>`;
    return `<div class="page db-page g-page"><div class="db-in g-center">
      ${dRevealAll ? serieContHTML(L) : ""}
      ${head(L ? "Huit duels : pour chacun, clique le pays le plus élevé sur la statistique indiquée. Tu peux changer d'avis, puis valide — tout se révèle d'un coup. Chaque erreur ajoute +1 à ton score du jour."
               : "Eight duels: for each, click the country that ranks higher on the stat shown. Change your mind freely, then submit — everything reveals at once. Each error adds +1 to your daily score.")}
      <div class="dr-list">${rows}</div>
      ${foot}
    </div></div>`;
  }
  // ── Libre : arène un duel à la fois, série à ne pas casser.
  const q = dQ[Math.min(dIdx, dQ.length - 1)];
  const met = D_METRICS.find(x => x.k === q.m);
  const reveal = dOver;
  const side = (iso) => {
    const cls = reveal
      ? (iso === q.win ? " right" : (iso === dLastWrong ? " wrong" : ""))
      : "";
    return `<button class="dl-side${cls}" data-dpick="${iso}"${reveal ? " disabled" : ""}>
      <img class="dl-flag" src="https://cdn.jsdelivr.net/npm/flag-icons@7/flags/4x3/${iso.toLowerCase()}.svg" alt="">
      <span class="dl-name">${esc(gName(iso))}</span>
      ${reveal ? `<span class="dl-val">${met.f(dVal(iso, q.m), L)}</span>` : ""}
      ${reveal && iso === q.win ? `<span class="dl-mark ok">✓</span>` : ""}
      ${reveal && iso !== q.win && iso === dLastWrong ? `<span class="dl-mark ko">✗</span>` : ""}
    </button>`;
  };
  const done = dOver
    ? `<div class="g-banner">💥 ${L ? "Raté ! Série de" : "Missed! Streak of"} ${dStreak}.</div>
       <div class="serie-cont"><button class="db-all" data-gnew>⟳ ${L ? "Retenter" : "Try again"}</button></div>`
    : "";
  return `<div class="page db-page g-page"><div class="db-in g-center">
    ${head(L ? "Deux pays, une statistique : clique celui qui est au-dessus. Une erreur met fin à la série — enchaîne pour battre ton record."
             : "Two countries, one stat: click the higher one. One miss ends the streak — chain runs to beat your best.")}
    <div class="dl-metric">${esc(L ? met.fr : met.en)} ${L ? "le plus élevé" : "— which is higher?"}</div>
    <div class="dl-arena">${side(q.a)}<span class="dl-vs">VS</span>${side(q.b)}</div>
    <div class="g-bar" style="justify-content:center"><span class="g-count">${L ? "Série" : "Streak"} : ${dStreak}</span></div>
    ${done}
  </div></div>`;
}

// ── Jeu « Podium » : trouve le top 3 mondial de la statistique du jour ──
let pDaily = false, pMetric = null, pTop = [], pFound = {}, pGuesses = [], pTries = 0, pWon = false;
function pRank(metricK){
  return gPool().map(iso => ({ iso, v: dVal(iso, metricK) }))
    .filter(x => x.v != null).sort((x, y) => y.v - x.v);
}
function pNew(daily){
  pDaily = !!daily; pFound = {}; pGuesses = []; pTries = 0; pWon = false;
  const idx = daily
    ? seedHash("podium" + todayKey()) % D_METRICS.length
    : Math.floor(Math.random() * D_METRICS.length);
  pMetric = D_METRICS[idx];
  pTop = pRank(pMetric.k).slice(0, 3).map(x => x.iso);
}
function pGuess(iso){
  if (pWon || pGuesses.includes(iso)) return;
  pGuesses.push(iso); pTries++;
  const r = pTop.indexOf(iso);
  if (r >= 0){ pFound[iso] = r;
    if (Object.keys(pFound).length === 3){ pWon = true;
      if (pDaily){ serieSave("podium", pTries); serieRecord(); Auth.onSeriesComplete(); serieMaybeCelebrate(); } } }
  el("view-games").innerHTML = renderGames();
  const inp = el("view-games").querySelector(".g-in");
  if (inp && !pWon) inp.focus();
}
function renderPodiumGame(){
  const L = lang === "fr";
  if (!pMetric) pNew(pDaily);
  if (!pTop.length) return `<div class="soon"><div class="soon-load" role="status" aria-label="Chargement">…</div></div>`;
  const ranked = pRank(pMetric.k);
  const rankOf = (iso) => ranked.findIndex(x => x.iso === iso);
  const medals = ["🥇", "🥈", "🥉"];
  const slots = [0, 1, 2].map(r => {
    const iso = Object.keys(pFound).find(k => pFound[k] === r);
    return `<div class="pd-slot${iso ? " got" : ""}">
        <span class="pd-medal">${medals[r]}</span>
        ${iso
          ? `<span class="pd-name">${esc(gName(iso))}</span><span class="pd-val">${pMetric.f(dVal(iso, pMetric.k), L)}</span>`
          : `<span class="pd-name dim">?</span>`}
      </div>`;
  }).join("");
  const rows = [...pGuesses].reverse().filter(iso => !(iso in pFound)).slice(0, 8).map(iso => {
    const r = rankOf(iso);
    return `<div class="fg-g"><span class="fg-gn">${esc(gName(iso))}</span>
      <span class="pd-rank">${r >= 0 ? "#" + (r + 1) : "—"}</span></div>`;
  }).join("");
  const win = pWon
    ? `<div class="g-banner">🎉 ${L ? "Podium complet en" : "Podium complete in"} ${pTries} ${L ? (pTries > 1 ? "essais" : "essai") : (pTries > 1 ? "guesses" : "guess")} !</div>
       ${pDaily ? "" : `<div class="serie-cont"><button class="db-all" data-gnew>⟳ ${L ? "Nouveau podium" : "New podium"}</button></div>`}`
    : "";
  return `<div class="page db-page g-page"><div class="db-in g-center">
    <button class="g-back" data-ghub>← ${L ? "Sélection de jeux" : "Game selection"}</button>
    ${pDaily && pWon ? serieContHTML(L) : ""}
    <div class="g-eyebrow">${pDaily
      ? (L ? "Super Série · " : "Super Series · ") + esc(new Date().toLocaleDateString(L ? "fr-BE" : "en-GB", { day: "numeric", month: "long" }))
      : (L ? "Jeu" : "Game")}</div>
    <h1 class="g-title">${L ? "Podium" : "Podium"}</h1>
    <p class="lead">${L
      ? `Trouve les trois premiers pays du monde pour : ${esc(pMetric.fr).toLowerCase()}. Chaque proposition ratée révèle son rang réel — resserre le tir.`
      : `Find the world's top three countries for: ${esc(pMetric.en).toLowerCase()}. Each miss reveals its real rank — narrow it down.`}</p>
    <div class="pd-cat">${esc(L ? pMetric.fr : pMetric.en)}</div>
    <div class="pd-slots">${slots}</div>
    <div class="g-bar">
      <div class="g-searchwrap">
        <input class="g-in" type="text" autocomplete="off" spellcheck="false"
          placeholder="${L ? "Propose un pays…" : "Guess a country…"}"${pWon ? " disabled" : ""}>
        <div class="g-sug"></div>
      </div>
      <span class="g-count">${pTries} ${L ? "essai" : "guess"}${pTries > 1 ? (L ? "s" : "es") : ""}</span>
    </div>
    ${win}
    <div class="fg-guesses">${rows || `<div class="g-empty">${L ? "Fais un premier essai." : "Make a first guess."}</div>`}</div>
  </div></div>`;
}

      c: /^[A-Z]{2}$/.test(p.get("c") || "") ? p.get("c") : null,

  window.addEventListener("popstate", (e) => {
    const st = e.state || {};

    if (v === "games") gScreen = st.gScreen || "hub";

  el("navMenu").addEventListener("click", (e) => {

  const burger = el("navBurger");

  // Onglet FX : montant mis à jour en place (pas de re-render → focus conservé),

  el("view-games").addEventListener("keydown", (e) => {

  el("view-games").addEventListener("click", (e) => {

    if (e.target.closest("[data-gplay]")){

    const sca = e.target.closest("[data-scaxis]");
    if (sca){
      const ax = sca.dataset.scaxis, fromK = ax === "x" ? scXInd : scYInd;
      if (ax === "x") scXInd = sca.dataset.k; else scYInd = sca.dataset.k;

    }
    const cre = e.target.closest("[data-cmpreset]");
    if (cre){ dbPicked.clear(); dbPickQuery = ""; drawDb(); return; }
    const rst = e.target.closest("[data-dbreset]");
    if (rst){
      dbQuery = ""; dbPicked.clear(); dbSort = "name"; dbDir = 1;
      dbRegions.clear(); dbGrades.clear(); dbQInd = null; dbQuarts.clear();
      dbVisible = new Set(DB_COLS.filter(c => !c.always).map(c => c.key));
      drawDb();
      return;
    }
    const freg = e.target.closest("[data-freg]");
    if (freg){ const r = freg.dataset.freg; dbRegions.has(r) ? dbRegions.delete(r) : dbRegions.add(r);
      drawDb(); return; }
    const fgr = e.target.closest("[data-fgrade]");
    if (fgr){ const g = fgr.dataset.fgrade; dbGrades.has(g) ? dbGrades.delete(g) : dbGrades.add(g);
      drawDb(); return; }
    const fqi = e.target.closest("[data-fqind]");
    if (fqi){ dbQInd = dbQInd === fqi.dataset.fqind ? null : fqi.dataset.fqind;
      drawDb(); return; }
    const fq = e.target.closest("[data-fq]");
    if (fq){ const n = +fq.dataset.fq; dbQuarts.has(n) ? dbQuarts.delete(n) : dbQuarts.add(n);

    const th = e.target.closest("th[data-sort]");

    else { dbSort = key; dbDir = (DB_COLS.find(c => c.key === key)?.text) ? 1 : -1; }
    drawDb();
  });
  el("view-benchmark").addEventListener("input", (e) => {
    const cb = e.target.closest("input[data-col]");
    if (cb) return;   // les cases passent par l'écouteur change
    const scs = e.target.closest(".sc-search");
    if (scs){ scQuery = scs.value; applyScSearch(); return; }   // pas de re-rendu
    const ps = e.target.closest(".cmp-pick-search");
    if (ps){
      dbPickQuery = ps.value;
      const pos = ps.selectionStart;
      drawDb();
      const p2 = el("view-benchmark").querySelector(".cmp-pick-search");
      if (p2){ p2.focus(); p2.setSelectionRange(pos, pos); }
      return;
    }
    const s = e.target.closest(".db-search");
    if (!s) return;
    dbQuery = s.value;
    const pos = s.selectionStart;
    drawDb();
    const s2 = el("view-benchmark").querySelector(".db-search");
    if (s2){ s2.focus(); s2.setSelectionRange(pos, pos); }   // le curseur ne saute pas
  });
  el("view-benchmark").addEventListener("change", (e) => {
    const pc = e.target.closest("input[data-pickctry]");
    if (pc){
      const iso = pc.dataset.pickctry;
      if (pc.checked && !dbPicked.has(iso) && dbPicked.size >= MAX_PICK){
        pc.checked = false;   // refus : on ne dépasse pas la limite
        const box = el("view-benchmark").querySelector(".cmp-pick-err");
        if (box){
          box.textContent = lang === "fr" ? `Maximum ${MAX_PICK} pays.` : `Maximum ${MAX_PICK} countries.`;
          box.style.display = "block";
          clearTimeout(pickErrTimer);
          pickErrTimer = setTimeout(() => {
            const b = el("view-benchmark").querySelector(".cmp-pick-err");
            if (b) b.style.display = "none";
          }, 2500);
        }
        return;
      }
      if (pc.checked) dbPicked.add(iso); else dbPicked.delete(iso);
      const list = el("view-benchmark").querySelector(".cmp-pick-list");
      const st = list ? list.scrollTop : 0;
      drawDb();
      const l2 = el("view-benchmark").querySelector(".cmp-pick-list");
      if (l2) l2.scrollTop = st;   // la liste ne saute pas au cochage
      return;
    }
    const pk = e.target.closest("input[data-pick]");
    if (pk){
      if (pk.checked) dbPicked.add(pk.dataset.pick); else dbPicked.delete(pk.dataset.pick);
      drawDb();
      return;
    }
    const cb = e.target.closest("input[data-col]");
    if (!cb) return;
    if (cb.checked) dbVisible.add(cb.dataset.col); else dbVisible.delete(cb.dataset.col);
    drawDb();
  });

  // Survol du comparateur : guide vertical, points sur chaque courbe et
  // infobulle listant la valeur de tous les pays pour l'année survolée.
  const cmpHideTip = () => {
    const plot = el("view-benchmark").querySelector(".compare-plot");
    if (plot){
      const g = plot.querySelector(".cmp-guide"); if (g) g.style.display = "none";
      plot.querySelectorAll(".cmp-hdot").forEach(d => d.style.display = "none");
    }
    const tip = el("view-benchmark").querySelector(".cmp-tip");
    if (tip) tip.style.display = "none";
  };
  el("view-benchmark").addEventListener("pointermove", (e) => {
    // — Nuage : même infobulle que la carte (#tip suit le curseur : ISO + nom).
    const sdot = e.target.closest(".sc-dot");
    {
      const gtip = el("tip");
      const prev = el("view-benchmark").querySelector(".sc-dot.hov");
      if (prev && prev !== sdot) prev.classList.remove("hov");
      if (sdot && gtip){
        sdot.classList.add("hov");
        gtip.style.display = "flex";
        gtip.style.left = e.clientX + "px";
        gtip.style.top  = e.clientY + "px";
        gtip.querySelector("b").textContent = sdot.dataset.iso || "··";
        gtip.querySelector("span").textContent = sdot.dataset.name || "";
      } else if (gtip && el("view-benchmark").querySelector(".sc-wrap")){
        if (gtip.dataset.pinned) applyScSearch();   // ré-épingle sur le résultat
        else gtip.style.display = "none";
      }
    }
    const plot = e.target.closest(".compare-plot");
    if (!plot){ cmpHideTip(); return; }
    const wrap = plot.closest(".cmp-wrap");
    const cols = JSON.parse(plot.dataset.cols);
    if (!cols.length) return;
    const fmt = plot.dataset.fmt;
    const vbw = +plot.dataset.vbw || 1000;
    const rect = plot.getBoundingClientRect();
    const vbX = (e.clientX - rect.left) / rect.width * vbw;   // px écran → unités viewBox
    let best = cols[0], bd = Infinity;
    for (const c of cols){ const dd = Math.abs(c.x - vbX); if (dd < bd){ bd = dd; best = c; } }
    const guide = plot.querySelector(".cmp-guide");
    guide.setAttribute("x1", best.x); guide.setAttribute("x2", best.x); guide.style.display = "block";
    const hdots = plot.querySelectorAll(".cmp-hdot");
    hdots.forEach(d => d.style.display = "none");
    best.vals.forEach(val => { const dot = hdots[val.si];
      if (dot){ dot.setAttribute("cx", best.x); dot.setAttribute("cy", val.y); dot.style.display = "block"; } });
    const tip = wrap.querySelector(".cmp-tip");
    tip.innerHTML = `<div class="ty">${best.year}</div>` + best.vals.map(v =>
      `<div class="tr"><span class="sw" style="background:${v.color}"></span>${esc(v.name)}<b>${esc(fmtHist(v.v, fmt))}</b></div>`).join("");
    tip.style.display = "block";
    const wr = wrap.getBoundingClientRect();
    const gx = rect.left + best.x / vbw * rect.width - wr.left;
    const tw = tip.offsetWidth;
    let left = gx + 14; if (left + tw > wr.width - 6) left = gx - tw - 14;
    tip.style.left = Math.max(6, left) + "px";
    tip.style.top = Math.max(6, rect.top - wr.top + 8) + "px";
  });
  el("view-benchmark").addEventListener("pointerleave", () => {
    cmpHideTip();
    const h = el("view-benchmark").querySelector(".sc-dot.hov"); if (h) h.classList.remove("hov");
    const gt = el("tip");
    if (gt && !gt.dataset.pinned && el("view-benchmark").querySelector(".sc-wrap")) gt.style.display = "none";
  });

  // Données locales chargées EN PARALLÈLE (elles sont indépendantes) :
  // macro (FMI), fiches d'identité, marchés (OCDE/FRED), notations (Wikipédia).
  // Chacune reste non bloquante : si un fichier manque, son bloc ne s'affiche pas.
  const [rMacro, rIdent, rYields, rRatings] = await Promise.allSettled([
    fetch("./macro.json"), fetch("./countries.json"),
    fetch("./yields.json"), fetch("./ratings.json"),
  ]);
  const readJson = async (settled) => {
    try { if (settled.status === "fulfilled" && settled.value.ok) return await settled.value.json(); }
    catch {}
    return null;
  };
  const dMacro = await readJson(rMacro), dIdent = await readJson(rIdent),
        dYields = await readJson(rYields), dRatings = await readJson(rRatings);
  const failed = [];
  if (dMacro) macro = dMacro; else failed.push({ key:"macro", fr:"données économiques", en:"economic data" });
  if (dIdent) ident = dIdent; else failed.push({ key:"ident", fr:"fiches pays", en:"country profiles" });
  if (dYields) yields = dYields; else failed.push({ key:"yields", fr:"marchés", en:"markets" });
  if (dRatings) ratings = dRatings; else failed.push({ key:"ratings", fr:"notations", en:"ratings" });
  if (failed.length) showDataWarning(failed);

  const nCountries = Object.keys(macro.countries || {}).length;
  // Les données sont chargées : on restaure l'onglet mémorisé dans l'URL en
  // dotant l'entrée d'historique initiale du bon état (sans créer de doublon).
  const v0 = viewFromHash();
  history.replaceState({ view: v0, gScreen: "hub" }, "", location.hash || location.pathname + location.search);
  applyView(v0);
  hubWorldBg();   // fond pointillé global (se relance seul quand les données sont prêtes)
  function renderStamp(){
    const s = el("stamp"); if (!s) return;   // date/pays retirés du bandeau fusionné
    const loc = lang === "fr" ? "fr-BE" : "en-GB";
    s.textContent =
      `${new Date().toLocaleDateString(loc, { day: "2-digit", month: "short" })} · ${nCountries} ${t("countriesWord")}`;
  }
  renderStamp();

  let topo;
  try {
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json");
    if(!r.ok) throw new Error();
    topo = await r.json();
  } catch {
    el("loading").textContent = "Le fond de carte n'a pas pu être chargé. Vérifie ta connexion et recharge.";
    return;
  }

  const features = buildFeatures(topo,"countries").filter(f => f.id !== "010");

  // Index de recherche : tout pays de la carte, qu'il soit couvert ou non.
  const searchable = features.map(f => {
    const iso = isoOf(f);
    const nameEn = f.properties.name || "";
    // nom français : priorité au nom de macro.json (déjà en FR), sinon carte
    const nameFr = (iso && macro.countries?.[iso]?.name) || nameEn;
    return { iso, nameEn, nameFr, covered: hasContent(iso), feature: f };
  }).filter(x => x.nameEn || x.nameFr);

  // Mémorise la géométrie de chaque pays (on retient la plus grande empreinte
  // quand plusieurs entités partagent un ISO) pour dessiner sa silhouette dans
  // le jeu « Devine le drapeau ». Le nom anglais suit la même règle : sinon une
  // entité secondaire (ex. FR ← « Fr. S. Antarctic Lands ») écraserait le pays
  // principal, car plusieurs features partagent un même ISO.
  { const areaOf = (f) => { try { return d3.geoArea(f); } catch { return 0; } };
    const best = {};
    for (const x of searchable){
      if (!x.iso) continue;
      const a = areaOf(x.feature);
      if (best[x.iso] == null || a > best[x.iso]){
        best[x.iso] = a; GEO[x.iso] = x.feature;
        if (x.nameEn) NAME_EN[x.iso] = x.nameEn;
      }
    }
    // Géométries à disposition du globe du héro et des vignettes de jeux.
    GLOBE_FEATS = searchable.map(x => x.feature);
    if (view === "home") initGlobe();      // l'accueil attendait les données
  }

  // Nom d'affichage d'un pays de la carte, selon la langue active :
  // macro.json (déjà en FR) → nom anglais de la carte.
  // Lit `lang` à chaque appel : le tooltip suit la bascule FR/EN sans re-render.
  const nameByFeatureId = new Map(searchable.map(x => [x.feature.id, x]));
  const mapName = (d) => {
    const x = nameByFeatureId.get(d.id);
    if (!x) return d.properties.name || "—";
    return (lang === "en" ? x.nameEn : x.nameFr) || x.nameFr || x.nameEn || "—";
  };

  // ── CARTE PLATE INFINIE (Mercator, façon Google Maps) ──
  // Le monde est projeté à plat et dessiné en TROIS copies côte à côte. Le
  // déplacement et le zoom se font par transformation du groupe SVG — aucune
  // reprojection : les tracés restent nets et le geste reste fluide. Quand on
  // défile horizontalement, on replie la position modulo la largeur d'un monde,
  // ce qui donne un défilement infini gauche/droite.
  const svg = d3.select("#map");
  const VB_W = 900, VB_H = 440;

  // Bande de latitudes des terres : on coupe l'océan austral vide (sous ~−53°,
  // l'Antarctique étant retiré) et l'Arctique glacé (au-dessus de ~74°). Ce
  // cadrage garde le même rapport largeur/hauteur que la fenêtre → un SEUL monde
  // la remplit exactement, sans bande vide ni pays affichés en double.
  const LAT_S = -53, LAT_N = 74;
  const worldBox = { type:"Polygon", coordinates:[[[-180,LAT_S],[180,LAT_S],[180,LAT_N],[-180,LAT_N],[-180,LAT_S]]] };
  const projection = d3.geoMercator().fitExtent([[0,0],[VB_W,VB_H]], worldBox);
  const path = d3.geoPath(projection);

  const W = projection([180,0])[0] - projection([-180,0])[0];   // largeur d'un monde (px @k=1)
  const by0 = path.bounds(worldBox)[0][1];
  const by1 = path.bounds(worldBox)[1][1];

  const tip = el("tip");
  let currentK = 1, panning = false;
  let tapDown = null;   // position/instant du pointerdown, pour distinguer tap vs pan

  // Fond océan plein cadre, fixe, derrière tout (remplit au-dessus et en dessous
  // du monde quand on défile verticalement).
  svg.append("rect").attr("class","ocean-bg").attr("width",VB_W).attr("height",VB_H);

  const g = svg.append("g");                 // groupe transformé par le zoom
  const graticule = d3.geoGraticule10();

  // Trois copies du monde décalées de -W, 0, +W. Chacune porte le graticule et
  // les pays avec leurs événements ; survol et sélection agissent sur les trois
  // (elles partagent la classe .country et la même donnée).
  for (const o of [-1, 0, 1]){
    const world = g.append("g").attr("transform", `translate(${o * W},0)`);
    world.append("path").attr("class","grat").attr("d", path(graticule));
    world.selectAll("path.country").data(features).join("path")
      .attr("class", d => "country" + (hasContent(isoOf(d)) ? " covered" : ""))
      .attr("d", path)
      .attr("tabindex", 0)
      .attr("role","button")
      .attr("aria-label", d => mapName(d))
      // La sélection au tap/clic est gérée au niveau du SVG (voir plus bas) :
      // d3-zoom capture le pointer sur le SVG, donc pointerup/click n'arrivent
      // jamais jusqu'ici sur tactile. On ne garde ici que le clavier (a11y).
      .on("keydown", function(e,d){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); selectCountry(isoOf(d), mapName(d), d); }
      })
      .on("mousemove", (e,d) => {
        if (panning) return;
        tip.style.display = "flex";
        tip.style.left = e.clientX + "px";
        tip.style.top  = e.clientY + "px";
        tip.querySelector("b").textContent = isoOf(d) || "··";
        tip.querySelector("span").textContent = mapName(d);
      })
      .on("mouseleave", () => { tip.style.display = "none"; });
  }

  // Bride le défilement vertical : le monde ne peut pas décoller des bords haut
  // et bas (et se centre s'il est plus court que le cadre).
  function clampY(t){
    const wh = (by1 - by0) * t.k;
    if (wh <= VB_H) return (VB_H - wh) / 2 - by0 * t.k;
    return Math.max(VB_H - by1 * t.k, Math.min(-by0 * t.k, t.y));
  }
  const initT = () => d3.zoomIdentity.translate(0, clampY(d3.zoomIdentity));

  const zoom = d3.zoom()
    .scaleExtent([1, 20])
    .on("start", () => { panning = true; svg.classed("dragging", true); tip.style.display = "none"; })
    .on("zoom", (e) => {
      let t = e.transform;
      const y = clampY(t);
      // Repli horizontal infini — uniquement sur geste utilisateur, pour ne pas
      // perturber une animation de recentrage (transition programmée).
      let x = t.x;
      if (e.sourceEvent){
        const worldW = W * t.k;
        x = ((t.x % worldW) + worldW) % worldW;
      }
      if (x !== t.x || y !== t.y){
        t = d3.zoomIdentity.translate(x, y).scale(t.k);
        if (e.sourceEvent) svg.node().__zoom = t;   // évite la dérive de l'état interne
      }
      currentK = t.k;
      g.attr("transform", t);
      tip.style.display = "none";
    })
    .on("end", () => { panning = false; svg.classed("dragging", false); });

  svg.call(zoom).call(zoom.transform, initT());

  // Sélection au tap/clic — gérée ICI, au niveau du SVG, et non sur chaque pays.
  // Raison : d3-zoom fait setPointerCapture sur le <svg> au pointerdown ; dès
  // lors tous les événements pointer (pointerup, click) sont redirigés vers le
  // SVG et n'atteignent jamais le <path> du pays. On enregistre donc le début du
  // geste (phase capture, avant que d3-zoom ne coupe la propagation) puis, au
  // relâchement, si le doigt/curseur a peu bougé (= tap, pas un pan), on retrouve
  // le pays réellement sous le point via elementFromPoint. Marche souris + tactile.
  {
    const mapNode = svg.node();
    mapNode.addEventListener("pointerdown", (e) => {
      tapDown = { x: e.clientX, y: e.clientY, t: Date.now() };
    }, true);   // capture : passe avant le handler bubble de d3-zoom
    mapNode.addEventListener("pointerup", (e) => {
      if (!tapDown) return;
      const moved = Math.hypot(e.clientX - tapDown.x, e.clientY - tapDown.y);
      const dt = Date.now() - tapDown.t;
      tapDown = null;
      if (moved >= 10 || dt >= 700) return;               // pan ou appui long : on ignore
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const pathEl = hit && hit.closest ? hit.closest("path.country") : null;
      const d = pathEl && pathEl.__data__;
      if (d) selectCountry(isoOf(d), mapName(d), d);
    });
  }

  // Sélection d'un pays — partagée par le clic ET la recherche. Indépendante du
  // déplacement : cliquer surligne sans bouger la carte.
  function selectCountry(iso, name, feature){
    selected = { iso, name };
    if (view !== "map") setView("map");   // un clic/recherche ramène sur la carte
    else history.replaceState({ view: "map", gScreen: "hub" }, "", hashFor("map"));
    g.selectAll("path.country").classed("on", x => !!iso && isoOf(x) === iso);
    g.selectAll("path.country.on").each(function(){ this.parentNode.appendChild(this); });
    renderPanel();
    // Mobile (mise en page empilée, < 900px) : le panneau est SOUS la carte.
    // Sans ça, taper un pays affiche sa fiche hors écran et semble ne rien faire.
    // On l'amène à l'écran en douceur.
    if (window.matchMedia("(max-width: 899px)").matches){
      requestAnimationFrame(() => {
        const p = el("panel");
        if (p) p.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  }
  window.__select = selectCountry;
  window.__searchable = searchable;
  // Deep-link : si l'URL portait un pays (#…&c=FR&t=analysis), on le restaure
  // maintenant que la carte et window.__select existent.
  {
    const h0 = parseHash();
    if (h0.view === "map" && h0.c && (macro.countries?.[h0.c] || ident[h0.c])){
      if (window.matchMedia("(max-width: 899px)").matches){
        // Mobile : on repart d'une carte vierge à chaque chargement (pas de pays
        // restauré). On retire aussi le pays de l'URL pour rester cohérent.
        history.replaceState({ view:"map", gScreen:"hub" }, "", hashFor("map"));
      } else {
        if (h0.t) panelTab = h0.t;
        selectCountry(h0.c, (macro.countries?.[h0.c]?.name) || h0.c);
      }
    }
  }

  // Le plus gros morceau d'un pays : sert à la fois à viser (centroïde) et à
  // mesurer sa taille à l'écran, sans être faussé par des îles lointaines.
  function mainPart(feature){
    const gm = feature.geometry; if (!gm) return null;
    if (gm.type === "Polygon") return gm;
    let best = null, bestA = -1;
    for (const poly of gm.coordinates){
      const pf = { type:"Polygon", coordinates: poly };
      const a = d3.geoArea(pf);
      if (a > bestA){ bestA = a; best = pf; }
    }
    return best || gm;
  }

  // Recentre la carte sur un pays (recherche) en l'affichant TOUJOURS à une
  // échelle confortable : on choisit le zoom pour que le pays occupe une part
  // constante du cadre, avec une marge qui laisse voir les voisins. Un petit
  // pays est donc zoomé (mais pas trop — plafond K_MAX, ce qui garde le rendu
  // agréable actuel), un très grand pays (Russie, Canada…) est au contraire
  // dézoomé pour rester lisible dans son contexte plutôt que de tout remplir.
  const K_MAX = 2.5, FILL = 0.55;
  function panTo(feature){
    const main = mainPart(feature); if (!main) return;
    const c = d3.geoCentroid(main);
    const p = projection(c);
    const b = path.bounds({ type:"Feature", geometry: main });
    const bw = Math.max(1, b[1][0] - b[0][0]);
    const bh = Math.max(1, b[1][1] - b[0][1]);
    // zoom pour que le pays remplisse ~FILL du cadre (le côté le plus contraint)
    let k = Math.min(FILL * VB_W / bw, FILL * VB_H / bh);
    k = Math.max(1, Math.min(k, K_MAX));   // jamais sous le monde entier, ni au-delà du plafond
    const cur = d3.zoomTransform(svg.node());
    const worldW = W * k;
    let tx = VB_W/2 - k * p[0];
    while (tx - cur.x >  worldW/2) tx -= worldW;   // plus court chemin
    while (tx - cur.x < -worldW/2) tx += worldW;
    let t = d3.zoomIdentity.translate(tx, VB_H/2 - k * p[1]).scale(k);
    t = d3.zoomIdentity.translate(tx, clampY(t)).scale(k);
    (reduceMotion ? svg : svg.transition().duration(700)).call(zoom.transform, t);
  }

  const by = (k) => () => {
    (reduceMotion ? svg : svg.transition().duration(220)).call(zoom.scaleBy, k);
  };
  el("zin").onclick  = by(1.6);
  el("zout").onclick = by(1 / 1.6);
  function resetView(){
    (reduceMotion ? svg : svg.transition().duration(400)).call(zoom.transform, initT());
  }
  el("zreset").onclick = resetView;

  // Ctrl+Z (ou ⌘+Z) remet la carte à zéro — sauf si on est en train d'écrire
  // dans un champ (on laisse alors l'annulation de texte habituelle).
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z")){
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) return;
      e.preventDefault();
      resetView();
    }
  });


  if (macro.fx?.usdToEur) {
    el("fx").hidden = false;
    ctlGlide(el("fx"), true);
    el("fx").addEventListener("click", (e) => {
      const b = e.target.closest("[data-cur]");
      if (!b) return;
      currency = b.dataset.cur;
      try { localStorage.setItem("atlas-currency", currency); } catch {}
      for (const btn of el("fx").querySelectorAll("button")) {
        const on = btn.dataset.cur === currency;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", String(on));
      }
      ctlGlide(el("fx"));
      // Le panneau pays ET le tableur affichent des montants : on rerend les deux.
      if (selected) renderPanel();
      renderView(view);
    });
  }

  // ── recherche de pays ──
  const searchBox = el("search"), resultsBox = el("results");
  searchBox.placeholder = t("searchPlaceholder");
  let hiIndex = -1;

  // Nom affiché selon la langue active du site.
  const dispName = (x) => (lang === "en" ? x.nameEn : x.nameFr) || x.nameFr || x.nameEn;

  function runSearch(){
    const q = searchBox.value.trim().toLowerCase();
    resultsBox.innerHTML = "";
    hiIndex = -1;
    if (!q) return;
    // On cherche dans les DEUX noms : "allemagne" comme "germany" trouvent DE.
    const seenIso = new Set();
    const hits = searchable.filter(x =>
      x.nameFr.toLowerCase().includes(q) ||
      x.nameEn.toLowerCase().includes(q) ||
      (x.iso && x.iso.toLowerCase() === q)
    )
    // Un même pays peut être éclaté en plusieurs entités (France = métropole +
    // outre-mer, toutes sur FR). On n'en garde qu'une ligne par code ISO.
    .filter(x => !x.iso || (!seenIso.has(x.iso) && seenIso.add(x.iso)))
    // Priorité : code ISO exact ("us" → États-Unis), puis noms commençant par
    // la saisie, puis le reste en alphabétique.
    .sort((a, b) => {
      const ai = a.iso && a.iso.toLowerCase() === q ? 0 : 1;
      const bi = b.iso && b.iso.toLowerCase() === q ? 0 : 1;
      if (ai !== bi) return ai - bi;
      const ap = dispName(a).toLowerCase().startsWith(q) ? 0 : 1;
      const bp = dispName(b).toLowerCase().startsWith(q) ? 0 : 1;
      if (ap !== bp) return ap - bp;
      return dispName(a).localeCompare(dispName(b), "fr");
    }).slice(0, 8);
    if (!hits.length){
      resultsBox.innerHTML = `<div class="empty2">${t("noMatch")}</div>`;
      return;
    }
    resultsBox.innerHTML = hits.map((h,i) => `
      <button type="button" data-iso="${h.iso || ""}" data-idx="${i}">
        <span class="riso">${h.iso || "··"}</span>
        <span>${esc(dispName(h))}</span>
        ${h.covered ? '<span class="rdot"></span>' : ''}
      </button>`).join("");
    resultsBox._hits = hits;
  }

  function pickSearch(i){
    const hits = resultsBox._hits || [];
    const h = hits[i]; if (!h) return;
    selectCountry(h.iso, dispName(h), h.feature);
    panTo(h.feature);   // recentre la carte sur le pays choisi
    searchBox.value = ""; resultsBox.innerHTML = "";
  }

  searchBox.addEventListener("input", runSearch);
  searchBox.addEventListener("keydown", (e) => {
    const btns = [...resultsBox.querySelectorAll("[data-idx]")];
    if (e.key === "ArrowDown"){ e.preventDefault(); hiIndex = Math.min(hiIndex+1, btns.length-1); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); hiIndex = Math.max(hiIndex-1, 0); }
    else if (e.key === "Enter"){ e.preventDefault(); pickSearch(hiIndex < 0 ? 0 : hiIndex); return; }
    else if (e.key === "Escape"){ searchBox.value = ""; resultsBox.innerHTML = ""; return; }
    else return;
    btns.forEach((b,i) => b.classList.toggle("hi", i === hiIndex));
  });
  resultsBox.addEventListener("click", (e) => {
    const b = e.target.closest("[data-idx]");
    if (b) pickSearch(Number(b.dataset.idx));
  });
  document.addEventListener("click", (e) => {
    if (!el("search").contains(e.target)) resultsBox.innerHTML = "";
  });

  // ── bascule de langue ──
  // Métadonnées du document : attribut lang (accessibilité/SEO) + titre.
  const applyLangMeta = () => {
    document.documentElement.lang = lang;
    document.title = lang === "fr" ? "Atlas · Marchés — macroéconomie, risque souverain et FX de 183 pays" : "Atlas · Markets — macroeconomics, sovereign risk and FX for 183 countries";
  };
  el("lang").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lang]");
    if (!b) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("atlas-lang", lang); } catch {}
    applyLangMeta();
    for (const btn of el("lang").querySelectorAll("button")){
      const on = btn.dataset.lang === lang;
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", String(on));
    }
    ctlGlide(el("lang"));
    // retraduire tout ce qui vit hors du panneau
    el("eyebrow").textContent = t("eyebrow");
    el("lg-cov").textContent = t("covered");
    el("lg-not").textContent = t("notYet");
    searchBox.placeholder = t("searchPlaceholder");
    renderStamp();
    renderPanel();  // le panneau se retraduit intégralement
    renderTabs();
    renderNavMenu();
    paintFoot();
    renderView(view);  // retraduit la vue active (lexique, données, but…)
    g.selectAll("path.country").attr("aria-label", d => mapName(d)); // lecteurs d'écran
    if (searchBox.value.trim()) runSearch();  // réafficher les noms traduits
  });

  el("loading").hidden = true;
  el("map").hidden = false;
  el("zoomctl").hidden = false;
  el("legend").hidden = false;
  ctlGlide(el("lang"), true);

// ═══ Couche d'interactions « premium » ═══════════════════════════════════
// Globe 3D réel (canvas, données de la carte), inclinaison 3D des cartes au
// curseur, boutons magnétiques, parallaxe au défilement. Tout est coupé si
// l'utilisateur préfère réduire les animations, et inactif au tactile.
const FX_ON = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const FX_POINTER = window.matchMedia("(pointer: fine)").matches;

// ── Globe du héro : orthographique, auto-rotation, glisser pour tourner. ──
// Perf : le globe utilise le trait de côte 110m (UNE géométrie très légère),
// pas les 240 pays haute résolution de la carte — dessin ~10× moins coûteux.
let globeTimer = null, GLOBE_LAND = null, globeLandLoading = false;
async function loadGlobeLand(){
  if (GLOBE_LAND || globeLandLoading) return;
  globeLandLoading = true;
  try {
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json");
    if (!r.ok) throw new Error();
    const topo = await r.json();
    GLOBE_LAND = buildFeatures(topo, "land");
  } catch { GLOBE_LAND = null; }
  globeLandLoading = false;
  initGlobe();
}
function themeVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function initGlobe(){
  const cv = el("heroGlobe");
  if (!cv || cv.dataset.on) return;
  if (!GLOBE_LAND){ loadGlobeLand(); return; }   // ira se relancer une fois chargé
  cv.dataset.on = "1";
  const dpr = 1;                              // décoratif : 1× suffit, moitié moins de pixels
  const size = () => Math.min(460, Math.max(300, window.innerWidth * 0.34));
  let S = size();
  const ctx = cv.getContext("2d");
  const proj = d3.geoOrthographic().clipAngle(90);
  const path = d3.geoPath(proj, ctx);
  const sphere = { type: "Sphere" };
  let rot = [-15, -18], vel = 0.05, dragging = false, last = null;
  let cols = {}, lastDraw = 0, onScreen = true;
  // Pause complète quand le globe sort du viewport (scroll de la landing).
  if ("IntersectionObserver" in window)
    new IntersectionObserver((en) => { onScreen = en[0].isIntersecting; }).observe(cv);
  const fit = () => { S = size();
    cv.width = S * dpr; cv.height = S * dpr;
    cv.style.width = S + "px"; cv.style.height = S + "px";
    proj.fitExtent([[10, 10], [S - 10, S - 10]], sphere); };
  fit();
  const readCols = () => { cols = {
    ocean: themeVar("--ocean"), land: themeVar("--land"), glow: themeVar("--indigo") }; };
  readCols();
  // Relecture immédiate des couleurs quand le thème bascule (fini le délai).
  new MutationObserver(readCols).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  function frame(elapsed){
    if (view !== "home" || !cv.isConnected || !onScreen) return;   // en veille
    if (elapsed - lastDraw < 42 && !dragging) return;              // ~24 fps : fluide et léger
    lastDraw = elapsed;
    if (!dragging && FX_ON) rot = [rot[0] + vel * 5, rot[1]];
    proj.rotate(rot);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    // sphère + halo (pas de graticule : c'était le poste de coût par frame)
    ctx.beginPath(); path(sphere);
    ctx.fillStyle = cols.ocean; ctx.fill();
    ctx.strokeStyle = cols.glow; ctx.globalAlpha = .5; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.globalAlpha = 1;
    // terres (trait de côte 110m : une poignée de polygones)
    ctx.beginPath();
    for (const f of GLOBE_LAND) path(f);
    ctx.fillStyle = cols.land; ctx.fill();
  }
  if (globeTimer) globeTimer.stop();
  globeTimer = d3.timer(frame);
  // Glisser pour tourner (souris ou doigt).
  cv.addEventListener("pointerdown", (e) => { dragging = true; last = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    rot = [rot[0] + (e.clientX - last[0]) * .35, Math.max(-70, Math.min(70, rot[1] - (e.clientY - last[1]) * .35))];
    last = [e.clientX, e.clientY];
  });
  const up = () => { dragging = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  window.addEventListener("resize", fit);
}

// ── Reflet qui suit la souris (sans bouger la carte) : .tiltable. ────────
// On ne fait plus tourner ni translater : seul le halo (--gx/--gy) suit le
// curseur. Sobre, et ça préserve l'effet de lumière apprécié en mode sombre.
if (FX_ON && FX_POINTER){
  let cur = null;
  document.addEventListener("pointermove", (e) => {
    const t = e.target.closest && e.target.closest(".tiltable");
    if (cur && cur !== t){ cur.style.removeProperty("--gx"); cur.style.removeProperty("--gy"); }
    cur = t;
    if (!t) return;
    const r = t.getBoundingClientRect();
    t.style.setProperty("--gx", (((e.clientX - r.left) / r.width) * 100).toFixed(1) + "%");
    t.style.setProperty("--gy", (((e.clientY - r.top) / r.height) * 100).toFixed(1) + "%");
  });
}
