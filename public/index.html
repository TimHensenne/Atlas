    const hb = e.target.closest("[data-ghint]");
    if (hb){ gHint = true; el("view-games").innerHTML = renderGames();
      el("view-games").querySelector(".g-in")?.focus(); return; }
    const pk = e.target.closest("[data-gpick]");
    if (pk) (gScreen === "flag" ? fGuess : gGuess)(pk.dataset.gpick);
  });
  el("view-purpose").addEventListener("submit", (e) => {
    if (e.target.classList.contains("fb-form")){ e.preventDefault(); submitFeedback(e.target); }
  });
  // Base de données : tri par en-tête, colonnes cochables.
  el("view-benchmark").addEventListener("click", (e) => {
    const rst = e.target.closest("[data-dbreset]");
    if (rst){
      dbQuery = ""; dbPicked.clear(); dbSort = "name"; dbDir = 1;
      dbRegions.clear(); dbGrades.clear(); dbQInd = null; dbQuarts.clear();
      dbVisible = new Set(DB_COLS.filter(c => !c.always).map(c => c.key));
      el("view-benchmark").innerHTML = renderDatabase();
      return;
    }
    const freg = e.target.closest("[data-freg]");
    if (freg){ const r = freg.dataset.freg; dbRegions.has(r) ? dbRegions.delete(r) : dbRegions.add(r);
      el("view-benchmark").innerHTML = renderDatabase(); return; }
    const fgr = e.target.closest("[data-fgrade]");
    if (fgr){ const g = fgr.dataset.fgrade; dbGrades.has(g) ? dbGrades.delete(g) : dbGrades.add(g);
      el("view-benchmark").innerHTML = renderDatabase(); return; }
    const fqi = e.target.closest("[data-fqind]");
    if (fqi){ dbQInd = dbQInd === fqi.dataset.fqind ? null : fqi.dataset.fqind;
      el("view-benchmark").innerHTML = renderDatabase(); return; }
    const fq = e.target.closest("[data-fq]");
    if (fq){ const n = +fq.dataset.fq; dbQuarts.has(n) ? dbQuarts.delete(n) : dbQuarts.add(n);
      el("view-benchmark").innerHTML = renderDatabase(); return; }
    const th = e.target.closest("th[data-sort]");
    if (!th) return;
    const key = th.dataset.sort;
    if (dbSort === key) dbDir = -dbDir;
    else { dbSort = key; dbDir = (DB_COLS.find(c => c.key === key)?.text) ? 1 : -1; }
    el("view-benchmark").innerHTML = renderDatabase();
  });
  el("view-benchmark").addEventListener("input", (e) => {
    const cb = e.target.closest("input[data-col]");
    if (cb) return;   // les cases passent par l'écouteur change
    const s = e.target.closest(".db-search");
    if (!s) return;
    dbQuery = s.value;
    const pos = s.selectionStart;
    el("view-benchmark").innerHTML = renderDatabase();
    const s2 = el("view-benchmark").querySelector(".db-search");
    if (s2){ s2.focus(); s2.setSelectionRange(pos, pos); }   // le curseur ne saute pas
  });
  el("view-benchmark").addEventListener("change", (e) => {
    const pk = e.target.closest("input[data-pick]");
    if (pk){
      if (pk.checked) dbPicked.add(pk.dataset.pick); else dbPicked.delete(pk.dataset.pick);
      el("view-benchmark").innerHTML = renderDatabase();
      return;
    }
    const cb = e.target.closest("input[data-col]");
    if (!cb) return;
    if (cb.checked) dbVisible.add(cb.dataset.col); else dbVisible.delete(cb.dataset.col);
    el("view-benchmark").innerHTML = renderDatabase();
  });

  try {
    const r = await fetch("./macro.json");
    if(r.ok) macro = await r.json();
  } catch {}

  // Fiches d'identité (capitale, monnaie, population…) — données locales, sans
  // API externe. Chargement non bloquant : si absent, l'onglet Identité affiche
  // simplement « indisponible ».
  try {
    const r = await fetch("./countries.json");
    if(r.ok) ident = await r.json();
  } catch {}

  // Marchés (rendements 10 ans + spreads) — données locales OCDE/FRED. Absentes
  // pour les pays hors OCDE : le bloc Marchés n'apparaît alors simplement pas.
  try {
    const r = await fetch("./yields.json");
    if(r.ok) yields = await r.json();
  } catch {}

  // Notations souveraines (S&P/Moody's/Fitch) — données locales issues de
  // Wikipédia. Absentes pour les pays non notés : le bloc ne s'affiche pas.
  try {
    const r = await fetch("./ratings.json");
    if(r.ok) ratings = await r.json();
  } catch {}

  const nCountries = Object.keys(macro.countries || {}).length;
  // Les données sont chargées : on peut restaurer l'onglet mémorisé dans l'URL.
  if (viewFromHash() !== "map") setView(viewFromHash());
  function renderStamp(){
    const loc = lang === "fr" ? "fr-BE" : "en-GB";
    const gen = macro.generatedAt;
    el("stamp").textContent = gen
      ? `${new Date(gen).toLocaleString(loc,{day:"2-digit",month:"short"})} · ${nCountries} ${t("countriesWord")}`
      : `${nCountries} ${t("countriesWord")}`;
  }
  renderStamp();

  let topo;
  try {
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json");
    if(!r.ok) throw new Error();
    topo = await r.json();
  } catch {
    el("loading").textContent = "Le fond de carte n'a pas pu être chargé. Vérifie ta connexion et recharge.";
    return;
  }

  const features = buildFeatures(topo,"countries").filter(f => f.id !== "010");

  // Index de recherche : tout pays de la carte, qu'il soit couvert ou non.
  const searchable = features.map(f => {
    const iso = isoOf(f);
    const nameEn = f.properties.name || "";
    // nom français : priorité au nom de macro.json (déjà en FR), sinon carte
    const nameFr = (iso && macro.countries?.[iso]?.name) || nameEn;
    return { iso, nameEn, nameFr, covered: hasContent(iso), feature: f };
  }).filter(x => x.nameEn || x.nameFr);
  for (const x of searchable) if (x.iso && x.nameEn) NAME_EN[x.iso] = x.nameEn;

  // Mémorise la géométrie de chaque pays (on retient la plus grande empreinte
  // quand plusieurs entités partagent un ISO) pour dessiner sa silhouette dans
  // le jeu « Devine le drapeau ».
  { const areaOf = (f) => { try { return d3.geoArea(f); } catch { return 0; } };
    const best = {};
    for (const x of searchable){
      if (!x.iso) continue;
      const a = areaOf(x.feature);
      if (best[x.iso] == null || a > best[x.iso]){ best[x.iso] = a; GEO[x.iso] = x.feature; }
    } }

  // Nom d'affichage d'un pays de la carte, selon la langue active :
  // macro.json (déjà en FR) → nom anglais de la carte.
  // Lit `lang` à chaque appel : le tooltip suit la bascule FR/EN sans re-render.
  const nameByFeatureId = new Map(searchable.map(x => [x.feature.id, x]));
  const mapName = (d) => {
    const x = nameByFeatureId.get(d.id);
    if (!x) return d.properties.name || "—";
    return (lang === "en" ? x.nameEn : x.nameFr) || x.nameFr || x.nameEn || "—";
  };

  // ── CARTE PLATE INFINIE (Mercator, façon Google Maps) ──
  // Le monde est projeté à plat et dessiné en TROIS copies côte à côte. Le
  // déplacement et le zoom se font par transformation du groupe SVG — aucune
  // reprojection : les tracés restent nets et le geste reste fluide. Quand on
  // défile horizontalement, on replie la position modulo la largeur d'un monde,
  // ce qui donne un défilement infini gauche/droite.
  const svg = d3.select("#map");
  const VB_W = 900, VB_H = 440;

  // Bande de latitudes des terres : on coupe l'océan austral vide (sous ~−53°,
  // l'Antarctique étant retiré) et l'Arctique glacé (au-dessus de ~74°). Ce
  // cadrage garde le même rapport largeur/hauteur que la fenêtre → un SEUL monde
  // la remplit exactement, sans bande vide ni pays affichés en double.
  const LAT_S = -53, LAT_N = 74;
  const worldBox = { type:"Polygon", coordinates:[[[-180,LAT_S],[180,LAT_S],[180,LAT_N],[-180,LAT_N],[-180,LAT_S]]] };
  const projection = d3.geoMercator().fitExtent([[0,0],[VB_W,VB_H]], worldBox);
  const path = d3.geoPath(projection);

  const W = projection([180,0])[0] - projection([-180,0])[0];   // largeur d'un monde (px @k=1)
  const by0 = path.bounds(worldBox)[0][1];
  const by1 = path.bounds(worldBox)[1][1];

  const tip = el("tip");
  let currentK = 1, panning = false;

  // Fond océan plein cadre, fixe, derrière tout (remplit au-dessus et en dessous
  // du monde quand on défile verticalement).
  svg.append("rect").attr("class","ocean-bg").attr("width",VB_W).attr("height",VB_H);

  const g = svg.append("g");                 // groupe transformé par le zoom
  const graticule = d3.geoGraticule10();

  // Trois copies du monde décalées de -W, 0, +W. Chacune porte le graticule et
  // les pays avec leurs événements ; survol et sélection agissent sur les trois
  // (elles partagent la classe .country et la même donnée).
  for (const o of [-1, 0, 1]){
    const world = g.append("g").attr("transform", `translate(${o * W},0)`);
    world.append("path").attr("class","grat").attr("d", path(graticule));
    world.selectAll("path.country").data(features).join("path")
      .attr("class", d => "country" + (hasContent(isoOf(d)) ? " covered" : ""))
      .attr("d", path)
      .attr("tabindex", 0)
      .attr("role","button")
      .attr("aria-label", d => mapName(d))
      .on("click", (e,d) => selectCountry(isoOf(d), mapName(d), d))
      .on("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); this.dispatchEvent(new Event("click")); }
      })
      .on("mousemove", (e,d) => {
        if (panning) return;
        tip.style.display = "flex";
        tip.style.left = e.clientX + "px";
        tip.style.top  = e.clientY + "px";
        tip.querySelector("b").textContent = isoOf(d) || "··";
        tip.querySelector("span").textContent = mapName(d);
      })
      .on("mouseleave", () => { tip.style.display = "none"; });
  }

  // Bride le défilement vertical : le monde ne peut pas décoller des bords haut
  // et bas (et se centre s'il est plus court que le cadre).
  function clampY(t){
    const wh = (by1 - by0) * t.k;
    if (wh <= VB_H) return (VB_H - wh) / 2 - by0 * t.k;
    return Math.max(VB_H - by1 * t.k, Math.min(-by0 * t.k, t.y));
  }
  const initT = () => d3.zoomIdentity.translate(0, clampY(d3.zoomIdentity));

  const zoom = d3.zoom()
    .scaleExtent([1, 20])
    .on("start", () => { panning = true; svg.classed("dragging", true); tip.style.display = "none"; })
    .on("zoom", (e) => {
      let t = e.transform;
      const y = clampY(t);
      // Repli horizontal infini — uniquement sur geste utilisateur, pour ne pas
      // perturber une animation de recentrage (transition programmée).
      let x = t.x;
      if (e.sourceEvent){
        const worldW = W * t.k;
        x = ((t.x % worldW) + worldW) % worldW;
      }
      if (x !== t.x || y !== t.y){
        t = d3.zoomIdentity.translate(x, y).scale(t.k);
        if (e.sourceEvent) svg.node().__zoom = t;   // évite la dérive de l'état interne
      }
      currentK = t.k;
      g.attr("transform", t);
      tip.style.display = "none";
    })
    .on("end", () => { panning = false; svg.classed("dragging", false); });

  svg.call(zoom).call(zoom.transform, initT());

  // Sélection d'un pays — partagée par le clic ET la recherche. Indépendante du
  // déplacement : cliquer surligne sans bouger la carte.
  function selectCountry(iso, name, feature){
    selected = { iso, name };
    if (view !== "map") setView("map");   // un clic/recherche ramène sur la carte
    g.selectAll("path.country").classed("on", x => !!iso && isoOf(x) === iso);
    g.selectAll("path.country.on").each(function(){ this.parentNode.appendChild(this); });
    renderPanel();
  }
  window.__select = selectCountry;
  window.__searchable = searchable;

  // Le plus gros morceau d'un pays : sert à la fois à viser (centroïde) et à
  // mesurer sa taille à l'écran, sans être faussé par des îles lointaines.
  function mainPart(feature){
    const gm = feature.geometry; if (!gm) return null;
    if (gm.type === "Polygon") return gm;
    let best = null, bestA = -1;
    for (const poly of gm.coordinates){
      const pf = { type:"Polygon", coordinates: poly };
      const a = d3.geoArea(pf);
      if (a > bestA){ bestA = a; best = pf; }
    }
    return best || gm;
  }

  // Recentre la carte sur un pays (recherche) en l'affichant TOUJOURS à une
  // échelle confortable : on choisit le zoom pour que le pays occupe une part
  // constante du cadre, avec une marge qui laisse voir les voisins. Un petit
  // pays est donc zoomé (mais pas trop — plafond K_MAX, ce qui garde le rendu
  // agréable actuel), un très grand pays (Russie, Canada…) est au contraire
  // dézoomé pour rester lisible dans son contexte plutôt que de tout remplir.
  const K_MAX = 2.5, FILL = 0.55;
  function panTo(feature){
    const main = mainPart(feature); if (!main) return;
    const c = d3.geoCentroid(main);
    const p = projection(c);
    const b = path.bounds({ type:"Feature", geometry: main });
    const bw = Math.max(1, b[1][0] - b[0][0]);
    const bh = Math.max(1, b[1][1] - b[0][1]);
    // zoom pour que le pays remplisse ~FILL du cadre (le côté le plus contraint)
    let k = Math.min(FILL * VB_W / bw, FILL * VB_H / bh);
    k = Math.max(1, Math.min(k, K_MAX));   // jamais sous le monde entier, ni au-delà du plafond
    const cur = d3.zoomTransform(svg.node());
    const worldW = W * k;
    let tx = VB_W/2 - k * p[0];
    while (tx - cur.x >  worldW/2) tx -= worldW;   // plus court chemin
    while (tx - cur.x < -worldW/2) tx += worldW;
    let t = d3.zoomIdentity.translate(tx, VB_H/2 - k * p[1]).scale(k);
    t = d3.zoomIdentity.translate(tx, clampY(t)).scale(k);
    (reduceMotion ? svg : svg.transition().duration(700)).call(zoom.transform, t);
  }

  const by = (k) => () => {
    (reduceMotion ? svg : svg.transition().duration(220)).call(zoom.scaleBy, k);
  };
  el("zin").onclick  = by(1.6);
  el("zout").onclick = by(1 / 1.6);
  function resetView(){
    (reduceMotion ? svg : svg.transition().duration(400)).call(zoom.transform, initT());
  }
  el("zreset").onclick = resetView;

  // Ctrl+Z (ou ⌘+Z) remet la carte à zéro — sauf si on est en train d'écrire
  // dans un champ (on laisse alors l'annulation de texte habituelle).
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z")){
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) return;
      e.preventDefault();
      resetView();
    }
  });


  if (macro.fx?.usdToEur) {
    el("fx").hidden = false;
    el("fx").addEventListener("click", (e) => {
      const b = e.target.closest("[data-cur]");
      if (!b) return;
      currency = b.dataset.cur;
      for (const btn of el("fx").querySelectorAll("button")) {
        const on = btn.dataset.cur === currency;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", String(on));
      }
      // Le panneau pays ET le tableur affichent des montants : on rerend les deux.
      if (selected) renderPanel();
      renderView(view);
    });
  }

  // ── recherche de pays ──
  const searchBox = el("search"), resultsBox = el("results");
  searchBox.placeholder = t("searchPlaceholder");
  let hiIndex = -1;

  // Nom affiché selon la langue active du site.
  const dispName = (x) => (lang === "en" ? x.nameEn : x.nameFr) || x.nameFr || x.nameEn;

  function runSearch(){
    const q = searchBox.value.trim().toLowerCase();
    resultsBox.innerHTML = "";
    hiIndex = -1;
    if (!q) return;
    // On cherche dans les DEUX noms : "allemagne" comme "germany" trouvent DE.
    const seenIso = new Set();
    const hits = searchable.filter(x =>
      x.nameFr.toLowerCase().includes(q) ||
      x.nameEn.toLowerCase().includes(q) ||
      (x.iso && x.iso.toLowerCase() === q)
    )
    // Un même pays peut être éclaté en plusieurs entités (France = métropole +
    // outre-mer, toutes sur FR). On n'en garde qu'une ligne par code ISO.
    .filter(x => !x.iso || (!seenIso.has(x.iso) && seenIso.add(x.iso)))
    // Priorité : code ISO exact ("us" → États-Unis), puis noms commençant par
    // la saisie, puis le reste en alphabétique.
    .sort((a, b) => {
      const ai = a.iso && a.iso.toLowerCase() === q ? 0 : 1;
      const bi = b.iso && b.iso.toLowerCase() === q ? 0 : 1;
      if (ai !== bi) return ai - bi;
      const ap = dispName(a).toLowerCase().startsWith(q) ? 0 : 1;
      const bp = dispName(b).toLowerCase().startsWith(q) ? 0 : 1;
      if (ap !== bp) return ap - bp;
      return dispName(a).localeCompare(dispName(b), "fr");
    }).slice(0, 8);
    if (!hits.length){
      resultsBox.innerHTML = `<div class="empty2">${t("noMatch")}</div>`;
      return;
    }
    resultsBox.innerHTML = hits.map((h,i) => `
      <button type="button" data-iso="${h.iso || ""}" data-idx="${i}">
        <span class="riso">${h.iso || "··"}</span>
        <span>${esc(dispName(h))}</span>
        ${h.covered ? '<span class="rdot"></span>' : ''}
      </button>`).join("");
    resultsBox._hits = hits;
  }

  function pickSearch(i){
    const hits = resultsBox._hits || [];
    const h = hits[i]; if (!h) return;
    selectCountry(h.iso, dispName(h), h.feature);
    panTo(h.feature);   // recentre la carte sur le pays choisi
    searchBox.value = ""; resultsBox.innerHTML = "";
  }

  searchBox.addEventListener("input", runSearch);
  searchBox.addEventListener("keydown", (e) => {
    const btns = [...resultsBox.querySelectorAll("[data-idx]")];
    if (e.key === "ArrowDown"){ e.preventDefault(); hiIndex = Math.min(hiIndex+1, btns.length-1); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); hiIndex = Math.max(hiIndex-1, 0); }
    else if (e.key === "Enter"){ e.preventDefault(); pickSearch(hiIndex < 0 ? 0 : hiIndex); return; }
    else if (e.key === "Escape"){ searchBox.value = ""; resultsBox.innerHTML = ""; return; }
    else return;
    btns.forEach((b,i) => b.classList.toggle("hi", i === hiIndex));
  });
  resultsBox.addEventListener("click", (e) => {
    const b = e.target.closest("[data-idx]");
    if (b) pickSearch(Number(b.dataset.idx));
  });
  document.addEventListener("click", (e) => {
    if (!el("search").contains(e.target)) resultsBox.innerHTML = "";
  });

  // ── bascule de langue ──
  el("lang").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lang]");
    if (!b) return;
    lang = b.dataset.lang;
    for (const btn of el("lang").querySelectorAll("button")){
      const on = btn.dataset.lang === lang;
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", String(on));
    }
    // retraduire tout ce qui vit hors du panneau
    el("eyebrow").textContent = t("eyebrow");
    el("lg-cov").textContent = t("covered");
    el("lg-not").textContent = t("notYet");
    searchBox.placeholder = t("searchPlaceholder");
    renderStamp();
    renderPanel();  // le panneau se retraduit intégralement
    renderTabs();
    renderView(view);  // retraduit la vue active (lexique, données, but…)
    g.selectAll("path.country").attr("aria-label", d => mapName(d)); // lecteurs d'écran
    if (searchBox.value.trim()) runSearch();  // réafficher les noms traduits
  });

  el("loading").hidden = true;
  el("map").hidden = false;
  el("zoomctl").hidden = false;
  el("legend").hidden = false;
  renderPanel();
}

// ── bascule jour / nuit ──
// Le thème est déjà appliqué par le script d'en-tête (anti-flash) ; ici on
// synchronise l'état des boutons et on gère le clic + la persistance.
(function setupTheme(){
  const box = el("theme"); if (!box) return;
  function paint(dark){
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    for (const b of box.querySelectorAll("button")){
      const on = (b.dataset.themeSet === "dark") === dark;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    }
  }
  paint(document.documentElement.getAttribute("data-theme") === "dark");
  box.addEventListener("click", (e) => {
    const b = e.target.closest("[data-theme-set]");
    if (!b) return;
    const dark = b.dataset.themeSet === "dark";
    paint(dark);
    try { localStorage.setItem("atlas-theme", dark ? "dark" : "light"); } catch {}
  });
})();

// ═══ Comptes & classement partagé (Supabase) ══════════════════════════════
// Entièrement isolé : si atlas-config.js n'est pas renseigné, cfgOK() est faux
// et TOUT reste en mode local (aucun bouton, palmarès local). Chaque appel
// réseau est en try/catch : la moindre erreur retombe proprement en local.
const Auth = (() => {
  let supa = null, user = null, profile = null, ready = false;
  let pendingAfter = null, busy = false;

  const cfgOK = () => { const c = window.ATLAS_SUPABASE;
    return !!(c && c.url && c.anon && !/VOTRE-PROJET|VOTRE_CLE/.test(String(c.url) + String(c.anon))); };
  const isLoggedIn = () => !!(ready && user);

  async function init(){
    bindOnce();
    if (!cfgOK()){ paintBar(); return; }                 // mode local
    try {
      const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      supa = mod.createClient(window.ATLAS_SUPABASE.url, window.ATLAS_SUPABASE.anon,
        { auth: { persistSession: true, autoRefreshToken: true } });
      ready = true;
      const { data } = await supa.auth.getSession();
      if (data && data.session && data.session.user){ user = data.session.user; await ensureProfile(); }
      supa.auth.onAuthStateChange(async (_e, session) => {
        user = (session && session.user) || null;
        if (user) await ensureProfile(); else profile = null;
        paintBar(); refreshHub();
      });
      paintBar();
    } catch { ready = false; supa = null; paintBar(); }   // échec de chargement → local
  }

  async function ensureProfile(){
    if (!supa || !user) return;
    try {
      let { data: p } = await supa.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if (!p){
        let prof = null;
        try { const pend = JSON.parse(localStorage.getItem("atlas-pending-profile") || "null");
          if (pend && pend.id === user.id) prof = pend; } catch {}
        if (!prof){ const base = (user.email || "joueur").split("@")[0].replace(/[^a-zA-Z0-9_]/g, "").slice(0, 20) || "joueur";
          prof = { id: user.id, pseudo: base, consent_optional: false }; }
        await supa.from("profiles").upsert(prof);
        localStorage.removeItem("atlas-pending-profile");
        const r = await supa.from("profiles").select("*").eq("id", user.id).maybeSingle();
        p = r.data;
      }
      profile = p || null;
    } catch { profile = null; }
  }

  function collectSignup(){
    const g = (id) => (el(id) ? el(id).value.trim() : "");
    const consent = !!(el("su-consent") && el("su-consent").checked);
    const yearRaw = g("su-year");
    const prof = { pseudo: g("su-pseudo") };
    if (consent){
      if (g("su-first")) prof.first_name = g("su-first");
      if (yearRaw && /^\d{4}$/.test(yearRaw)) prof.birth_year = parseInt(yearRaw, 10);
      if (el("su-sex") && el("su-sex").value) prof.sex = el("su-sex").value;
      if (g("su-country")) prof.country = g("su-country");
    }
    prof.consent_optional = consent;
    return { email: g("su-email"), password: g("su-pw"), prof };
  }

  async function doSignup(){
    if (busy) return; const L = lang === "fr";
    const { email, password, prof } = collectSignup();
    if (prof.pseudo.length < 2) return setMsg("err", L ? "Choisis un pseudo (2 caractères min.)." : "Pick a pseudonym (2+ chars).");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMsg("err", L ? "Adresse email invalide." : "Invalid email address.");
    if (password.length < 6) return setMsg("err", L ? "Mot de passe : 6 caractères minimum." : "Password: 6 characters minimum.");
    const pw2 = el("su-pw2") ? el("su-pw2").value : "";
    if (password !== pw2) return setMsg("err", L ? "Les deux mots de passe ne correspondent pas." : "The two passwords don't match.");
    setBusy(true);
    try {
      const { data, error } = await supa.auth.signUp({ email, password });
      if (error) throw error;
      const row = Object.assign({ id: data.user.id }, prof);
      if (data.session){                                  // confirmation email désactivée → session directe
        user = data.user;
        const up = await supa.from("profiles").upsert(row);
        if (up.error) throw up.error;
        await ensureProfile(); paintBar(); refreshHub();
        finishAuth(L ? "Compte créé, te voilà connecté !" : "Account created — you're in!");
      } else {                                            // confirmation email activée
        try { localStorage.setItem("atlas-pending-profile", JSON.stringify(row)); } catch {}
        setBusy(false);
        setMsg("ok", L ? "Compte créé. Confirme via l'email reçu, puis connecte-toi." : "Account created. Confirm via email, then log in.");
      }
    } catch (e){
      setBusy(false);
      const m = String(e && e.message || e);
      if (/duplicate|unique|already/i.test(m)) setMsg("err", L ? "Ce pseudo ou cet email est déjà pris." : "That pseudonym or email is taken.");
      else setMsg("err", (L ? "Échec : " : "Failed: ") + m);
    }
  }

  async function doLogin(){
    if (busy) return; const L = lang === "fr";
    const idRaw = el("au-id") ? el("au-id").value.trim() : "";
    const password = el("au-pw") ? el("au-pw").value : "";
    if (!idRaw || !password) return setMsg("err", L ? "Identifiant et mot de passe requis." : "Identifier and password required.");
    setBusy(true);
    try {
      let email = idRaw;
      if (!idRaw.includes("@")){                      // c'est un pseudo → on récupère l'email associé
        const { data, error } = await supa.rpc("email_for_pseudo", { p: idRaw });
        if (error || !data){ setBusy(false); return setMsg("err", L ? "Pseudo introuvable — essaie avec ton email." : "Unknown pseudonym — try your email."); }
        email = data;
      }
      const { error } = await supa.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await ensureProfile(); paintBar(); refreshHub();
      finishAuth(L ? "Connecté." : "Logged in.");
    } catch (e){
      setBusy(false);
      setMsg("err", (lang === "fr" ? "Connexion impossible : " : "Login failed: ") + String(e && e.message || e));
    }
  }

  async function logout(){
    try { await supa.auth.signOut(); } catch {}
    user = null; profile = null; paintBar(); refreshHub();
  }

  // ── Score du jour : une insertion (la RLS + clé primaire garantissent 1×/jour)
  async function onSeriesComplete(){
    if (!isLoggedIn()) return;
    let games; try { games = serieRead(); } catch { return; }
    if (SERIE.some(g => !games[g])) return;               // série incomplète
    const total = SERIE.reduce((s, g) => s + ((games[g] && games[g].tries) || 0), 0);
    const day = todayKey();
    if (sessionStorage.getItem("atlas-sent-" + day)) { fillLeaderboard(lang === "fr"); return; }
    try {
      const row = { user_id: user.id, total,
        country_tries: games.country ? games.country.tries : null,
        flag_tries: games.flag ? games.flag.tries : null };
      const { error } = await supa.from("daily_scores").insert(row);
      // 23505 = déjà une ligne aujourd'hui : normal (une tentative), on ignore.
      if (error && !/duplicate|23505|unique/i.test(String(error.message))) throw error;
      try { sessionStorage.setItem("atlas-sent-" + day, "1"); } catch {}
    } catch {}
    fillLeaderboard(lang === "fr");
  }

  async function fillLeaderboard(L){
    const card = el("lbCard"); if (!card || !supa) return;
    const head = '<div class="lb-h">' + (L ? "Classement du jour" : "Today's leaderboard") + '</div>'
      + '<div class="lb-sub">' + (L ? "Le moins d'essais gagne · une seule tentative." : "Fewest guesses wins · one attempt.") + '</div>';
    try {
      const { data, error } = await supa.from("leaderboard_today").select("pseudo,total").order("total", { ascending: true }).limit(20);
      if (error) throw error;
      const mine = profile && profile.pseudo;
      const rows = (data && data.length)
        ? data.map((r, i) => '<tr class="' + (r.pseudo === mine ? "me" : "") + '"><td class="lb-rk">' + (i + 1) + '</td><td class="lb-dt">' + esc(r.pseudo) + '</td><td class="lb-sc">' + r.total + '</td></tr>').join("")
        : '<tr><td colspan="3" class="lb-empty">' + (L ? "Personne n'a encore terminé aujourd'hui." : "No one has finished today yet.") + '</td></tr>';
      card.innerHTML = head
        + '<table class="lb"><thead><tr><th>#</th><th>' + (L ? "Joueur" : "Player") + '</th><th>' + (L ? "Essais" : "Guesses") + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
        + '<div class="lb-note">' + (L ? "Classement partagé, remis à zéro chaque jour." : "Shared ranking, reset daily.") + '</div>';
    } catch {
      card.innerHTML = head + '<div class="lb-note">' + (L ? "Classement indisponible pour le moment." : "Leaderboard unavailable right now.") + '</div>';
    }
  }

  // ── Barre supérieure ────────────────────────────────────────────────────
  function paintBar(){
    const bar = el("authbar"); if (!bar) return;
    if (!cfgOK()){ bar.hidden = true; bar.innerHTML = ""; return; }
    const L = lang === "fr";
    bar.hidden = false;
    if (isLoggedIn()){
      const who = profile && profile.pseudo ? profile.pseudo : (user.email || "").split("@")[0];
      bar.innerHTML = '<span class="who">👤 <b>' + esc(who) + '</b></span>'
        + '<button type="button" data-auth="logout">' + (L ? "Déconnexion" : "Log out") + '</button>';
    } else {
      bar.innerHTML = '<button type="button" data-auth="login-open">' + (L ? "Se connecter" : "Log in") + '</button>'
        + '<button type="button" class="pri" data-auth="signup-open">' + (L ? "S'inscrire" : "Sign up") + '</button>';
    }
  }
  function refreshHub(){ if (view === "games" && gScreen === "hub"){ el("view-games").innerHTML = renderGames(); } }

  // ── Modale ──────────────────────────────────────────────────────────────
  const EYE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-6M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  // Champ mot de passe avec œil afficher/masquer.
  function pwField(id, label, ac){
    return '<div class="m-field"><label>' + label + ' <span class="req">*</span></label>'
      + '<div class="pw-wrap"><input class="m-in" id="' + id + '" type="password" autocomplete="' + ac + '">'
      + '<button type="button" class="pw-eye" data-auth="toggle-pw" aria-label="Afficher / masquer">' + EYE + '</button></div></div>';
  }
  function fieldLogin(L){
    return '<div class="m-field"><label>' + (L ? "Pseudo ou email" : "Pseudonym or email") + ' <span class="req">*</span></label><input class="m-in" id="au-id" autocomplete="username"></div>'
      + pwField("au-pw", L ? "Mot de passe" : "Password", "current-password")
      + '<button class="m-go" data-auth="submit-login">' + (L ? "Se connecter" : "Log in") + '</button>'
      + '<div class="m-alt"><button data-auth="tab-signup">' + (L ? "Pas encore de compte ? S'inscrire" : "No account? Sign up") + '</button></div>';
  }
  function fieldSignup(L){
    const opt = L ? "facultatif" : "optional";
    return '<div class="m-field"><label>' + (L ? "Pseudo" : "Pseudonym") + ' <span class="req">*</span></label><input class="m-in" id="su-pseudo" maxlength="24" autocomplete="nickname"></div>'
      + '<div class="m-field"><label>Email <span class="req">*</span></label><input class="m-in" id="su-email" type="email" autocomplete="email"></div>'
      + pwField("su-pw", L ? "Mot de passe" : "Password", "new-password")
      + pwField("su-pw2", L ? "Confirmer le mot de passe" : "Confirm password", "new-password")
      + '<div class="m-opth">' + (L ? "Infos facultatives" : "Optional info") + '</div>'
      + '<div class="m-field"><label>' + (L ? "Prénom" : "First name") + ' (' + opt + ')</label><input class="m-in" id="su-first"></div>'
      + '<div class="m-row"><div class="m-field"><label>' + (L ? "Année de naissance" : "Birth year") + '</label><input class="m-in" id="su-year" inputmode="numeric" maxlength="4" placeholder="1999"></div>'
      + '<div class="m-field"><label>' + (L ? "Sexe" : "Sex") + '</label><select class="m-sel" id="su-sex"><option value="">—</option><option value="F">' + (L ? "Femme" : "Female") + '</option><option value="M">' + (L ? "Homme" : "Male") + '</option><option value="X">' + (L ? "Autre" : "Other") + '</option></select></div></div>'
      + '<div class="m-field"><label>' + (L ? "Pays" : "Country") + ' (' + opt + ')</label><input class="m-in" id="su-country"></div>'
      + '<label class="m-consent"><input type="checkbox" id="su-consent"><span>' + (L
          ? "J'accepte que mes infos facultatives soient conservées. "
          : "I agree to store my optional info. ") + '<a data-auth="privacy">' + (L ? "Confidentialité" : "Privacy") + '</a></span></label>'
      + '<button class="m-go" data-auth="submit-signup">' + (L ? "S'inscrire" : "Sign up") + '</button>'
      + '<div class="m-alt"><button data-auth="tab-login">' + (L ? "Déjà un compte ? Se connecter" : "Have an account? Log in") + '</button></div>';
  }
  function privacyHTML(L){
    if (!L) return '<div class="m-h">Privacy</div>'
      + '<div class="m-legal"><p>Atlas stores the data below to run accounts and the daily leaderboard.</p>'
      + '<h4>Data</h4><p>Required: pseudonym, email, password (hashed by Supabase). Optional (with consent): first name, birth year, sex, country. We never collect your postal address or any sensitive data.</p>'
      + '<h4>Purpose & basis</h4><p>Account &amp; login (necessity); optional fields and leaderboard display (your consent).</p>'
      + '<h4>Hosting</h4><p>Data is stored via Supabase. Transport is encrypted (HTTPS).</p>'
      + '<h4>Your rights</h4><p>Access, rectify, delete — contact [YOUR EMAIL]. You can delete your account at any time.</p>'
      + '<h4>Retention</h4><p>Until you delete your account. Daily scores may be purged periodically.</p></div>'
      + '<button class="m-go" data-auth="back">Back</button>';
    return '<div class="m-h">Confidentialité</div>'
      + '<div class="m-legal"><p>Atlas conserve les données ci-dessous pour gérer les comptes et le classement du jour.</p>'
      + '<h4>Données</h4><p>Obligatoires : pseudo, email, mot de passe (haché par Supabase, jamais en clair). Facultatives (avec ton consentement) : prénom, année de naissance, sexe, pays. Nous ne collectons ni adresse postale ni donnée sensible.</p>'
      + '<h4>Finalité &amp; base légale</h4><p>Compte et connexion (nécessité du service) ; champs facultatifs et affichage au classement (ton consentement, retirable).</p>'
      + '<h4>Hébergement</h4><p>Les données sont stockées via Supabase. Le transport est chiffré (HTTPS).</p>'
      + '<h4>Tes droits</h4><p>Accès, rectification, suppression — écris à [TON EMAIL]. Tu peux supprimer ton compte à tout moment.</p>'
      + '<h4>Conservation</h4><p>Jusqu\'à la suppression de ton compte. Les scores quotidiens peuvent être purgés régulièrement.</p></div>'
      + '<button class="m-go" data-auth="back">Retour</button>';
  }
  function renderModal(tab){
    const L = lang === "fr";
    const card = el("authModal").querySelector(".modal-card");
    let body;
    if (tab === "privacy") body = privacyHTML(L);
    else {
      const tabs = '<div class="m-tabs"><button data-auth="tab-login" class="' + (tab === "login" ? "on" : "") + '">' + (L ? "Connexion" : "Log in")
        + '</button><button data-auth="tab-signup" class="' + (tab === "signup" ? "on" : "") + '">' + (L ? "Inscription" : "Sign up") + '</button></div>';
      const intro = tab === "signup"
        ? '<div class="m-sub">' + (L ? "Un pseudo, un email, un mot de passe — c'est tout ce qu'il faut pour figurer au classement." : "A pseudonym, an email, a password — all you need to join the leaderboard.") + '</div>'
        : '<div class="m-sub">' + (L ? "Ravi de te revoir." : "Welcome back.") + '</div>';
      body = tabs + intro + (tab === "signup" ? fieldSignup(L) : fieldLogin(L)) + '<div class="m-msg" id="m-msg" hidden></div>';
    }
    card.innerHTML = '<button class="m-close" data-auth="close" aria-label="Fermer">×</button>' + body;
  }
  function openModal(tab, after){ pendingAfter = after || null; renderModal(tab || "login"); el("authModal").hidden = false; }
  function runPending(){ const after = pendingAfter; pendingAfter = null; if (typeof after === "function") after(); }
  function closeModal(){ const m = el("authModal"); if (m) m.hidden = true; busy = false; runPending(); }
  function finishAuth(){ const m = el("authModal"); if (m) m.hidden = true; busy = false; runPending(); }
  function setMsg(kind, text){ const m = el("m-msg"); if (!m){ return; } m.hidden = false; m.className = "m-msg " + kind; m.textContent = text; setBusy(false); }
  function setBusy(v){ busy = v; const cards = el("authModal"); if (!cards) return;
    cards.querySelectorAll(".m-go").forEach(b => { b.disabled = v; }); }

  // Invite à la connexion à l'entrée de la Super Série (une fois/session), non bloquant.
  function promptSeries(launch){
    if (!cfgOK() || isLoggedIn() || sessionStorage.getItem("atlas-serie-nag")){ launch(); return; }
    try { sessionStorage.setItem("atlas-serie-nag", "1"); } catch {}
    openModal("signup", launch);
  }

  let bound = false;
  function bindOnce(){
    if (bound) return; bound = true;
    document.addEventListener("click", (e) => {
      const a = e.target.closest("[data-auth]"); if (!a) return;
      const act = a.dataset.auth;
      if (act === "login-open") openModal("login", null);
      else if (act === "signup-open") openModal("signup", null);
      else if (act === "logout") logout();
      else if (act === "tab-login") renderModal("login");
      else if (act === "tab-signup") renderModal("signup");
      else if (act === "privacy") renderModal("privacy");
      else if (act === "back") renderModal("signup");
      else if (act === "close") closeModal();
      else if (act === "submit-login") doLogin();
      else if (act === "submit-signup") doSignup();
      else if (act === "toggle-pw"){
        const inp = a.parentElement && a.parentElement.querySelector("input");
        if (inp){ const show = inp.type === "password"; inp.type = show ? "text" : "password"; a.innerHTML = show ? EYE_OFF : EYE; }
      }
    });
    // Clic sur le fond → fermer.
    document.addEventListener("mousedown", (e) => {
      if (e.target && e.target.id === "authModal") closeModal();
    });
  }

  return { init, isLoggedIn, configured: cfgOK, onSeriesComplete, fillLeaderboard, promptSeries };
})();

boot();
Auth.init();
</script>
</body>
</html>
