  let pendingAfter = null, busy = false, pendingNote = "";

  const cfgOK = () => { const c = window.ATLAS_SUPABASE;
    return !!(c && c.url && c.anon && !/VOTRE-PROJET|VOTRE_CLE/.test(String(c.url) + String(c.anon))); };
  const isLoggedIn = () => !!(ready && user);

  async function init(){
    bindOnce();
    if (!cfgOK()){ paintBar(); return; }                 // mode local
    try {
      const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      supa = mod.createClient(window.ATLAS_SUPABASE.url, window.ATLAS_SUPABASE.anon,
        { auth: { persistSession: true, autoRefreshToken: true } });
      ready = true;
      const { data } = await supa.auth.getSession();
      if (data && data.session && data.session.user){ user = data.session.user; await ensureProfile(); }
      supa.auth.onAuthStateChange(async (_e, session) => {
        user = (session && session.user) || null;
        if (user) await ensureProfile(); else { profile = null; kickFromSerie(); }
        paintBar(); refreshHub();
      });
      paintBar();
    } catch { ready = false; supa = null; paintBar(); }   // échec de chargement → local
  }

  async function ensureProfile(){
    if (!supa || !user) return;
    try {
      let { data: p } = await supa.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if (!p){
        let prof = null;
        try { const pend = JSON.parse(localStorage.getItem("atlas-pending-profile") || "null");
          if (pend && pend.id === user.id) prof = pend; } catch {}
        if (!prof){ const base = (user.email || "joueur").split("@")[0].replace(/[^a-zA-Z0-9_]/g, "").slice(0, 20) || "joueur";
          prof = { id: user.id, pseudo: base, consent_optional: false }; }
        await supa.from("profiles").upsert(prof);
        localStorage.removeItem("atlas-pending-profile");
        const r = await supa.from("profiles").select("*").eq("id", user.id).maybeSingle();
        p = r.data;
      }
      profile = p || null;
    } catch { profile = null; }
  }

  function collectSignup(){
    const g = (id) => (el(id) ? el(id).value.trim() : "");
    const consent = !!(el("su-consent") && el("su-consent").checked);
    const yearRaw = g("su-year");
    const prof = { pseudo: g("su-pseudo") };
    if (consent){
      if (g("su-first")) prof.first_name = g("su-first");
      if (yearRaw && /^\d{4}$/.test(yearRaw)) prof.birth_year = parseInt(yearRaw, 10);
      if (el("su-sex") && el("su-sex").value) prof.sex = el("su-sex").value;
      if (g("su-country")) prof.country = g("su-country");
    }
    prof.consent_optional = consent;
    return { email: g("su-email"), password: g("su-pw"), prof };
  }

  async function doSignup(){
    if (busy) return; const L = lang === "fr";
    const { email, password, prof } = collectSignup();
    if (prof.pseudo.length < 2) return setMsg("err", L ? "Choisis un pseudo (2 caractères min.)." : "Pick a pseudonym (2+ chars).");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMsg("err", L ? "Adresse email invalide." : "Invalid email address.");
    if (password.length < 6) return setMsg("err", L ? "Mot de passe : 6 caractères minimum." : "Password: 6 characters minimum.");
    const pw2 = el("su-pw2") ? el("su-pw2").value : "";
    if (password !== pw2) return setMsg("err", L ? "Les deux mots de passe ne correspondent pas." : "The two passwords don't match.");
    setBusy(true);
    try {
      const { data, error } = await supa.auth.signUp({ email, password });
      if (error) throw error;
      const row = Object.assign({ id: data.user.id }, prof);
      if (data.session){                                  // confirmation email désactivée → session directe
        user = data.user;
        const up = await supa.from("profiles").upsert(row);
        if (up.error) throw up.error;
        await ensureProfile(); paintBar(); refreshHub();
        finishAuth(L ? "Compte créé, te voilà connecté !" : "Account created — you're in!");
      } else {                                            // confirmation email activée
        try { localStorage.setItem("atlas-pending-profile", JSON.stringify(row)); } catch {}
        setBusy(false);
        setMsg("ok", L ? "Compte créé. Confirme via l'email reçu, puis connecte-toi." : "Account created. Confirm via email, then log in.");
      }
    } catch (e){
      setBusy(false);
      const m = String(e && e.message || e);
      if (/duplicate|unique|already/i.test(m)) setMsg("err", L ? "Ce pseudo ou cet email est déjà pris." : "That pseudonym or email is taken.");
      else setMsg("err", (L ? "Échec : " : "Failed: ") + m);
    }
  }

  async function doLogin(){
    if (busy) return; const L = lang === "fr";
    const idRaw = el("au-id") ? el("au-id").value.trim() : "";
    const password = el("au-pw") ? el("au-pw").value : "";
    if (!idRaw || !password) return setMsg("err", L ? "Email et mot de passe requis." : "Email and password required.");
    if (!idRaw.includes("@")) return setMsg("err", L ? "Connecte-toi avec ton email." : "Log in with your email.");
    setBusy(true);
    try {
      const { error } = await supa.auth.signInWithPassword({ email: idRaw, password });
      if (error) throw error;
      await ensureProfile(); paintBar(); refreshHub();
      finishAuth(L ? "Connecté." : "Logged in.");
    } catch (e){
      setBusy(false);
      setMsg("err", (lang === "fr" ? "Connexion impossible : " : "Login failed: ") + String(e && e.message || e));
    }
  }

  async function logout(){
    kickFromSerie();                     // redirection IMMÉDIATE si on est dans la série,
    try { await supa.auth.signOut(); } catch {}   // avant même l'appel réseau
    user = null; profile = null; paintBar(); kickFromSerie(); refreshHub();
  }

  // ── Score du jour : une insertion (la RLS + clé primaire garantissent 1×/jour)
  async function onSeriesComplete(){
    if (!isLoggedIn()) return;
    let games; try { games = serieRead(); } catch { return; }
    if (SERIE.some(g => !games[g])) return;               // série incomplète
    const total = SERIE.reduce((s, g) => s + ((games[g] && games[g].tries) || 0), 0);
    const day = todayKey();
    if (sessionStorage.getItem("atlas-sent-" + day)) { fillLeaderboard(lang === "fr"); return; }
    try {
      const row = { user_id: user.id, total,
        country_tries: games.country ? games.country.tries : null,
        flag_tries: games.flag ? games.flag.tries : null };
      const { error } = await supa.from("daily_scores").insert(row);
      // 23505 = déjà une ligne aujourd'hui : normal (une tentative), on ignore.
      if (error && !/duplicate|23505|unique/i.test(String(error.message))) throw error;
      try { sessionStorage.setItem("atlas-sent-" + day, "1"); } catch {}
    } catch {}
    fillLeaderboard(lang === "fr");
  }

  async function fillLeaderboard(L){
    const card = el("lbCard"); if (!card || !supa) return;
    const head = '<div class="lb-h">' + (L ? "Classement du jour" : "Today's leaderboard") + '</div>'
      + '<div class="lb-sub">' + (L ? "Le moins d'essais gagne · une seule tentative." : "Fewest guesses wins · one attempt.") + '</div>';
    try {
      const { data, error } = await supa.from("leaderboard_today").select("pseudo,total").order("total", { ascending: true }).limit(20);
      if (error) throw error;
      const mine = profile && profile.pseudo;
      const rows = (data && data.length)
        ? data.map((r, i) => '<tr class="' + (r.pseudo === mine ? "me" : "") + '"><td class="lb-rk">' + (i + 1) + '</td><td class="lb-dt">' + esc(r.pseudo) + '</td><td class="lb-sc">' + r.total + '</td></tr>').join("")
        : '<tr><td colspan="3" class="lb-empty">' + (L ? "Personne n'a encore terminé aujourd'hui." : "No one has finished today yet.") + '</td></tr>';
      card.innerHTML = head
        + '<table class="lb"><thead><tr><th>#</th><th>' + (L ? "Joueur" : "Player") + '</th><th>' + (L ? "Essais" : "Guesses") + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
        + '<div class="lb-note">' + (L ? "Classement partagé, remis à zéro chaque jour." : "Shared ranking, reset daily.") + '</div>';
    } catch {
      card.innerHTML = head + '<div class="lb-note">' + (L ? "Classement indisponible pour le moment." : "Leaderboard unavailable right now.") + '</div>';
    }
  }

  // ── Barre supérieure ────────────────────────────────────────────────────
  function paintBar(){
    const bar = el("authbar"); if (!bar) return;
    if (!cfgOK()){ bar.hidden = true; bar.innerHTML = ""; return; }
    const L = lang === "fr";
    bar.hidden = false;
    if (isLoggedIn()){
      const who = profile && profile.pseudo ? profile.pseudo : (user.email || "").split("@")[0];
      bar.innerHTML = '<span class="who">👤 <b>' + esc(who) + '</b></span>'
        + '<button type="button" data-auth="logout">' + (L ? "Déconnexion" : "Log out") + '</button>';
    } else {
      bar.innerHTML = '<button type="button" data-auth="login-open">' + (L ? "Se connecter" : "Log in") + '</button>'
        + '<button type="button" class="pri" data-auth="signup-open">' + (L ? "S'inscrire" : "Sign up") + '</button>';
    }
  }
  function refreshHub(){ if (view === "games" && gScreen === "hub"){ el("view-games").innerHTML = renderGames(); } }
  // Déconnecté en pleine manche de la Super Série → retour au hub
  // (la série exige un compte ; le jeu libre, lui, reste accessible).
  function kickFromSerie(){
    if (view !== "games") return;
    const inDaily = (gScreen === "country" && gDaily) || (gScreen === "flag" && fDaily)
      || (gScreen === "duel" && dDaily) || (gScreen === "podium" && pDaily);
    if (!inDaily) return;
    gScreen = "hub";
    el("view-games").innerHTML = renderGames();
  }

  // ── Modale ──────────────────────────────────────────────────────────────
  const EYE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-6M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  // Champ mot de passe avec œil afficher/masquer.
  function pwField(id, label, ac){
    return '<div class="m-field"><label>' + label + ' <span class="req">*</span></label>'
      + '<div class="pw-wrap"><input class="m-in" id="' + id + '" type="password" autocomplete="' + ac + '">'
      + '<button type="button" class="pw-eye" data-auth="toggle-pw" aria-label="Afficher / masquer">' + EYE + '</button></div></div>';
  }
  function fieldLogin(L){
    return '<div class="m-field"><label>' + (L ? "Email" : "Email") + ' <span class="req">*</span></label><input class="m-in" id="au-id" type="email" autocomplete="email"></div>'
      + pwField("au-pw", L ? "Mot de passe" : "Password", "current-password")
      + '<button class="m-go" data-auth="submit-login">' + (L ? "Se connecter" : "Log in") + '</button>'
      + '<div class="m-alt"><button data-auth="tab-signup">' + (L ? "Pas encore de compte ? S'inscrire" : "No account? Sign up") + '</button></div>';
  }
  function fieldSignup(L){
    const opt = L ? "facultatif" : "optional";
    return '<div class="m-field"><label>' + (L ? "Pseudo" : "Pseudonym") + ' <span class="req">*</span></label><input class="m-in" id="su-pseudo" maxlength="24" autocomplete="nickname"></div>'
      + '<div class="m-field"><label>Email <span class="req">*</span></label><input class="m-in" id="su-email" type="email" autocomplete="email"></div>'
      + pwField("su-pw", L ? "Mot de passe" : "Password", "new-password")
      + pwField("su-pw2", L ? "Confirmer le mot de passe" : "Confirm password", "new-password")
      + '<div class="m-opth">' + (L ? "Infos facultatives" : "Optional info") + '</div>'
      + '<div class="m-field"><label>' + (L ? "Prénom" : "First name") + ' (' + opt + ')</label><input class="m-in" id="su-first"></div>'
      + '<div class="m-row"><div class="m-field"><label>' + (L ? "Année de naissance" : "Birth year") + '</label><input class="m-in" id="su-year" inputmode="numeric" maxlength="4" placeholder="1999"></div>'
      + '<div class="m-field"><label>' + (L ? "Sexe" : "Sex") + '</label><select class="m-sel" id="su-sex"><option value="">—</option><option value="F">' + (L ? "Femme" : "Female") + '</option><option value="M">' + (L ? "Homme" : "Male") + '</option><option value="X">' + (L ? "Autre" : "Other") + '</option></select></div></div>'
      + '<div class="m-field"><label>' + (L ? "Pays" : "Country") + ' (' + opt + ')</label><input class="m-in" id="su-country"></div>'
      + '<label class="m-consent"><input type="checkbox" id="su-consent"><span>' + (L
          ? "J'accepte que mes infos facultatives soient conservées. "
          : "I agree to store my optional info. ") + '<a data-auth="privacy">' + (L ? "Confidentialité" : "Privacy") + '</a></span></label>'
      + '<button class="m-go" data-auth="submit-signup">' + (L ? "S'inscrire" : "Sign up") + '</button>'
      + '<div class="m-alt"><button data-auth="tab-login">' + (L ? "Déjà un compte ? Se connecter" : "Have an account? Log in") + '</button></div>';
  }
  function privacyHTML(L){
    return legalHTML("privacy", L)
      + '<button class="m-go" data-auth="back">' + (L ? "Retour" : "Back") + '</button>';
  }
  function renderModal(tab){
    const L = lang === "fr";
    const card = el("authModal").querySelector(".modal-card");
    let body;
    if (tab === "privacy") body = privacyHTML(L);
    else {
      const tabs = '<div class="m-tabs"><button data-auth="tab-login" class="' + (tab === "login" ? "on" : "") + '">' + (L ? "Connexion" : "Log in")
        + '</button><button data-auth="tab-signup" class="' + (tab === "signup" ? "on" : "") + '">' + (L ? "Inscription" : "Sign up") + '</button></div>';
      const note = pendingNote
        ? '<div class="m-msg ok" style="margin:0 0 12px">' + esc(pendingNote) + '</div>' : "";
      const intro = tab === "signup"
        ? '<div class="m-sub">' + (L ? "Un pseudo, un email, un mot de passe — c'est tout ce qu'il faut pour figurer au classement." : "A pseudonym, an email, a password — all you need to join the leaderboard.") + '</div>'
        : '<div class="m-sub">' + (L ? "Ravi de te revoir." : "Welcome back.") + '</div>';
      body = tabs + note + intro + (tab === "signup" ? fieldSignup(L) : fieldLogin(L)) + '<div class="m-msg" id="m-msg" hidden></div>';
    }
    card.innerHTML = '<button class="m-close" data-auth="close" aria-label="Fermer">×</button>' + body;
  }
  function openModal(tab, after, note){ pendingAfter = after || null; pendingNote = note || "";
    renderModal(tab || "login"); el("authModal").hidden = false; }
  function runPending(){ const after = pendingAfter; pendingAfter = null; pendingNote = "";
    if (typeof after === "function") after(); }
  // Fermer sans se connecter = ANNULER l'action en attente (ne pas la lancer).
  function closeModal(){ const m = el("authModal"); if (m) m.hidden = true; busy = false;
    pendingAfter = null; pendingNote = ""; }
  // Connexion / inscription réussie = fermer PUIS lancer l'action en attente.
  function finishAuth(){ const m = el("authModal"); if (m) m.hidden = true; busy = false; runPending(); }
  function setMsg(kind, text){ const m = el("m-msg"); if (!m){ return; } m.hidden = false; m.className = "m-msg " + kind; m.textContent = text; setBusy(false); }
  function setBusy(v){ busy = v; const cards = el("authModal"); if (!cards) return;
    cards.querySelectorAll(".m-go").forEach(b => { b.disabled = v; }); }

  // La Super Série exige un compte (classement du jour, une tentative) :
  // sans connexion, on ouvre la modale et on NE lance PAS la manche.
  // En mode local (Supabase non configuré), pas de comptes → pas de blocage.
  function promptSeries(launch){
    if (!cfgOK() || isLoggedIn()){ launch(); return; }
    openModal("signup", launch, lang === "fr"
      ? "La Super Série demande un compte : une tentative par jour, et ton pseudo au classement."
      : "The Super Series needs an account: one attempt a day, and your pseudonym on the leaderboard.");
  }

  let bound = false;
  function bindOnce(){
    if (bound) return; bound = true;
    document.addEventListener("click", (e) => {
      const a = e.target.closest("[data-auth]"); if (!a) return;
      const act = a.dataset.auth;
      if (act === "login-open") openModal("login", null);
      else if (act === "signup-open") openModal("signup", null);
      else if (act === "logout") logout();
      else if (act === "tab-login") renderModal("login");
      else if (act === "tab-signup") renderModal("signup");
      else if (act === "privacy") renderModal("privacy");
      else if (act === "back") renderModal("signup");
      else if (act === "close") closeModal();
      else if (act === "submit-login") doLogin();
      else if (act === "submit-signup") doSignup();
      else if (act === "toggle-pw"){
        const inp = a.parentElement && a.parentElement.querySelector("input");
        if (inp){ const show = inp.type === "password"; inp.type = show ? "text" : "password"; a.innerHTML = show ? EYE_OFF : EYE; }
      }
    });
    // Clic sur le fond → fermer.
    document.addEventListener("mousedown", (e) => {
      if (e.target && e.target.id === "authModal") closeModal();
    });
    // Entrée dans un champ de la modale = clic sur le bouton du formulaire.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const modal = el("authModal");
      if (!modal || modal.hidden) return;                 // modale fermée → on ignore
      if (!e.target || e.target.tagName !== "INPUT") return;
      e.preventDefault();
      if (el("su-pseudo")) doSignup(); else if (el("au-id")) doLogin();
    });
  }

  // Rang du joueur dans le classement du jour (null si indisponible).
  async function myRankToday(){
    if (!isLoggedIn() || !supa || !profile || !profile.pseudo) return null;
    try {
      const { data, error } = await supa.from("leaderboard_today")
        .select("pseudo,total").order("total", { ascending: true }).limit(500);
      if (error || !data) return null;
      const i = data.findIndex(r => r.pseudo === profile.pseudo);
      if (i < 0) return null;
      return { rank: i + 1, total: data[i].total, players: data.length };
    } catch { return null; }
  }

  return { init, isLoggedIn, configured: cfgOK, onSeriesComplete, fillLeaderboard, promptSeries, myRankToday };
})();

// L'accueil est statique : on le peint tout de suite (avant les données),
// pour éviter une page blanche pendant le chargement.
if (!location.hash){ el("view-home").innerHTML = renderHome(); homeReveal(); }
paintFoot();
el("foot").addEventListener("click", (e) => {
  const b = e.target.closest("[data-legal]");
  if (b) openLegal(b.dataset.legal);
});
boot();
Auth.init();
</script>
</body>
