<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas · Marchés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Carte marine par grand jour : papier, eau pâle, encre indigo. */
    --paper:#F3F5F9; --panel:#FFFFFF;
    --ocean:#DCE7F0; --land:#C4CCD6; --land-hi:#9AA6B6;
    --ink:#131A2E; --dim:#5E6B84;
    --indigo:#2F45C8; --indigo-hi:#4257E6; --accent:#E23A2E; --accent-line:#B02419;
    --teal:#0FA8A0;
    --grad:linear-gradient(118deg,var(--indigo) 0%,var(--teal) 100%);
    --rule:rgba(19,26,46,.12); --rule-soft:rgba(19,26,46,.06);
    --scroll:rgba(19,26,46,.26); --scroll-hi:rgba(19,26,46,.42);
    --ctrl:rgba(255,255,255,.92); --shadow:rgba(19,26,46,.14); --topbar-bg:rgba(243,245,249,.82);
    --glass:rgba(255,255,255,.78);
    --r-s:8px; --r-m:12px; --r-l:16px;
    --elev1:0 1px 2px rgba(19,26,46,.06),0 4px 14px rgba(19,26,46,.07);
    --elev2:0 2px 6px rgba(19,26,46,.08),0 14px 34px rgba(19,26,46,.13);
    --display:'Geist',system-ui,sans-serif;
    --body:'Geist',system-ui,sans-serif;
    --mono:'Geist Mono','SF Mono',ui-monospace,monospace;
  }
  /* ── Mode nuit : carte marine de nuit, augmentée — mer profonde, panneaux
     de verre, lueurs d'aurore indigo/sarcelle. ── */
  :root[data-theme="dark"]{
    --paper:#070D1B; --panel:#131E33;
    --ocean:#081321; --land:#33445B; --land-hi:#45587A;
    --ink:#F2F6FD; --dim:#93A1BB;
    --indigo:#6B84F4; --indigo-hi:#8CA0F8; --accent:#F1503F; --accent-line:#B02419;
    --teal:#2FC8B9;
    --rule:rgba(233,237,245,.14); --rule-soft:rgba(233,237,245,.06);
    --scroll:rgba(233,237,245,.22); --scroll-hi:rgba(233,237,245,.4);
    --ctrl:rgba(19,30,51,.92); --shadow:rgba(0,0,0,.5);
    --topbar-bg:rgba(9,15,29,.72);
    --glass:rgba(19,30,51,.66);
    --elev1:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
    --elev2:0 4px 10px rgba(0,0,0,.35),0 22px 50px rgba(0,0,0,.45);
  }
  /* Transition douce au changement de thème (désactivée si mouvement réduit). */
  body,.topbar,.panel,.cell,.reports a,.results,#tip,.soon,.zoomctl button,.ocean-bg,.macro{
    transition:background-color .25s ease,border-color .25s ease,color .25s ease,fill .25s ease;}
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;font-feature-settings:"cv01","ss01";letter-spacing:-.006em;}
  /* Chiffres tabulaires partout : décimales alignées (données financières). */
  .mono,[class*="num"],.g-count,.fxv-table,.db,.lb,.hchip b,.sp-total b{font-variant-numeric:tabular-nums;}

  /* Sur grand écran, la page ne défile jamais : seul le panneau défile.
     Sur mobile le panneau passe sous la carte, donc la page redevient scrollable. */
  @media(min-width:900px){ body{overflow:hidden;} }

  /* Barres de défilement assorties au thème (jour/nuit) */
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;}
  ::-webkit-scrollbar{width:15px;height:15px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:7px;
    border:4px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hi);background-clip:padding-box;}
  ::-webkit-scrollbar-corner{background:transparent;}

  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:none;
    background:var(--topbar-bg);
    padding:16px 24px;border-bottom:1px solid var(--rule);}
  .brand{flex:none;}
  .wordmark{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--indigo);text-transform:uppercase;}
  /* Tous les outils vivent à droite, dans un seul groupe. L'espacement passe
     par le gap du conteneur — plus aucun margin-left bricolé sur les éléments. */
  .tools{display:flex;align-items:center;gap:10px;margin-left:auto;
    flex-wrap:wrap;justify-content:flex-end;}
  .stamp{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);
    text-transform:uppercase;}
  /* Devise et langue partagent exactement le même gabarit de bouton. */
  .fx,.lang,.theme{display:flex;border:1px solid var(--rule);}
  .fx button,.lang button,.theme button{background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;
    font-family:var(--mono);font-size:11px;padding:5px 10px;line-height:1;color:var(--dim);
    transition:background .15s ease,color .15s ease;}
  .fx button:last-child,.lang button:last-child,.theme button:last-child{border-right:0;}
  .fx button.on,.lang button.on,.theme button.on{background:var(--indigo);color:#FFF;}
  .fx button:hover:not(.on),.lang button:hover:not(.on),.theme button:hover:not(.on){background:var(--ocean);color:var(--ink);}
  .theme button{font-size:13px;padding:4px 9px;}
  .fx button:focus-visible,.lang button:focus-visible,.theme button:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px;}
  /* Mobile : les outils passent en pleine largeur sous la marque, la recherche
     s'étire pour occuper la place. La barre ne se disloque plus. */
  @media(max-width:640px){
    .tools{width:100%;margin-left:0;justify-content:flex-start;}
    .map-search{right:12px;}
    .map-search input{width:100%;}
  }

  .search{position:relative;}
  /* Recherche en surimpression sur la carte, coin supérieur gauche */
  .map-search{position:absolute;top:12px;left:12px;z-index:25;}
  .map-search input{background:var(--panel);box-shadow:0 1px 6px rgba(0,0,0,.12);}
  .search input{font-family:var(--body);font-size:13px;width:190px;padding:6px 10px;
    background:var(--panel);border:1px solid var(--rule);color:var(--ink);outline:none;
    transition:border-color .15s ease;}
  .search input:focus{border-color:var(--indigo);}
  .search input::placeholder{color:var(--dim);}
  .results{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:30;
    background:var(--panel);border:1px solid var(--rule);box-shadow:0 4px 14px rgba(19,26,46,.14);
    max-height:280px;overflow-y:auto;}
  .results:empty{display:none;}
  .results button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--rule-soft);cursor:pointer;
    padding:9px 11px;font-family:var(--body);font-size:13px;color:var(--ink);
    transition:background .12s ease;}
  .results button:last-child{border-bottom:0;}
  .results button:hover,.results button.hi{background:var(--ocean);}
  .results .riso{font-family:var(--mono);font-size:11px;color:var(--indigo);min-width:22px;}
  .results .rdot{width:7px;height:7px;border-radius:2px;background:var(--indigo);margin-left:auto;}
  .results .empty2{padding:10px 11px;font-size:12.5px;color:var(--dim);}

  .stage{display:flex;flex:1;min-height:0;flex-direction:column;}
  @media(min-width:900px){.stage{flex-direction:row;}}

  .mapcol{flex:1;min-width:0;min-height:0;padding:8px 12px 16px;display:flex;flex-direction:column;}
  .mapwrap{position:relative;flex:1;min-height:340px;display:flex;}
  #map{flex:1;width:100%;height:100%;min-height:0;display:block;touch-action:none;cursor:grab;background:var(--ocean);}
  #map.dragging{cursor:grabbing;}
  .ocean-bg{fill:var(--ocean);}
  .sphere{fill:var(--ocean);stroke:var(--rule);stroke-width:.8;vector-effect:non-scaling-stroke;}
  .grat{fill:none;stroke:var(--rule-soft);stroke-width:.5;vector-effect:non-scaling-stroke;}
  .country{fill:var(--land);stroke:var(--paper);stroke-width:.5;cursor:pointer;
    transition:fill .16s ease;outline:none;vector-effect:non-scaling-stroke;}
  .country:hover,.country:focus-visible{fill:var(--land-hi);}
  .country:focus-visible{stroke:var(--ink);stroke-width:1.2;}
  .country.covered{fill:var(--indigo);}
  .country.covered:hover,.country.covered:focus-visible{fill:var(--indigo-hi);}
  /* Pays sélectionné : simple changement de couleur (rouge vif). Pas de contour
     épais — il garde le fin liseré commun à tous les pays. */
  .country.on,
  .country.covered.on{fill:var(--accent);}
  .country.on:hover,.country.covered.on:hover{fill:var(--accent);}

  /* commandes de zoom */
  .zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;}
  .zoomctl button{width:34px;height:34px;background:var(--ctrl);color:var(--ink);
    border:1px solid var(--rule);font-family:var(--mono);font-size:16px;line-height:1;
    cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s ease;
    box-shadow:0 1px 2px var(--shadow);}
  .zoomctl button:hover{background:var(--ocean);}
  .zoomctl button:focus-visible{outline:2px solid var(--indigo);outline-offset:1px;}
  .zoomctl .reset{display:grid;place-items:center;}
  .zoomctl .reset svg{display:block;}

  .legend{display:flex;gap:18px;padding:10px 6px 0;flex:none;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;color:var(--dim);text-transform:uppercase;}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:1px;}

  #tip{position:fixed;pointer-events:none;z-index:20;background:var(--panel);color:var(--ink);
    border:1px solid var(--rule);padding:5px 9px;font-size:12px;display:none;
    gap:8px;align-items:center;transform:translate(10px,-130%);
    box-shadow:0 2px 6px rgba(19,26,46,.12);}
  #tip b{font-family:var(--mono);font-weight:500;color:var(--indigo);font-size:11px;}

  .panel{border-top:1px solid var(--rule);background:var(--panel);
    padding:22px 24px 32px;display:flex;flex-direction:column;gap:18px;}
  @media(min-width:900px){.panel{width:390px;flex:none;border-top:none;
    border-left:1px solid var(--rule);overflow-y:auto;overscroll-behavior:contain;}}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .phead > div{min-width:0;}
  /* Drapeau : cadre 4:3 uniforme pour tous (flag-icons normalise Suisse, Vatican
     et le fanion du Népal au même format). Le fond panneau apparaît dans les
     zones transparentes du Népal ; le liseré définit les bords des drapeaux
     clairs (Japon…). */
  .flag{flex:none;width:48px;height:36px;object-fit:cover;
    border:1px solid var(--rule);border-radius:3px;background:var(--panel);
    box-shadow:0 1px 2px var(--shadow);}
  .iso{font-family:var(--mono);font-size:38px;font-weight:500;color:var(--indigo);
    line-height:.9;letter-spacing:-.03em;}
  .cname{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1.1;}
  .csub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;margin-top:6px;}

  /* ── bloc données macro ── */
  .macro{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
    border:1px solid var(--rule);}
  .macro.identity{grid-auto-flow:row dense;}
  .cell{background:var(--panel);padding:12px 14px;}
  .cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim);
    text-transform:uppercase;}
  .cell .v{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.02em;
    margin-top:5px;line-height:1;}
  .cell .v small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim);
    letter-spacing:0;margin-left:3px;}
  .cell.wide{grid-column:1 / -1;}
  .trend-up{color:#1E7A46;} .trend-down{color:#B4462A;}
  /* Mini-graphe d'historique (15 ans) : en-tête = échelle verticale (min…max) qui
     devient « année · valeur » au survol ; bas = années début/fin. Les points et
     repères sont en HTML (positionnés en %) pour rester ronds même dans la case
     large du PIB, où le SVG est étiré. */
  .chart{margin:12px 0 2px;}
  .chart-head{font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--dim);
    height:12px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .1s ease;}
  .chart-head.on{color:var(--indigo);font-weight:500;}
  .spark-wrap{position:relative;height:48px;cursor:crosshair;margin-top:2px;}
  .spark{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .spark-line{fill:none;stroke:var(--indigo);stroke-width:1.5;
    stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;}
  .spark-zero{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 2;vector-effect:non-scaling-stroke;}
  .spark-end,.spark-hdot{position:absolute;width:6px;height:6px;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;}
  .spark-end{background:var(--accent);}
  .spark-hdot{background:var(--indigo);box-shadow:0 0 0 2px var(--panel);display:none;}
  .spark-guide{position:absolute;top:0;bottom:0;width:1px;background:var(--dim);opacity:.5;
    transform:translateX(-50%);pointer-events:none;display:none;}
  .chart-x{display:flex;justify-content:space-between;margin-top:2px;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--dim);opacity:.75;}
  .macro-src{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--dim);
    text-transform:uppercase;opacity:.8;margin-top:16px;}
  .mkt-sub{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--dim);margin-top:8px;}
  .mkt-sub b{color:var(--ink);font-weight:600;}
  /* Notation souveraine : trois agences côte à côte, couleur selon investment
     grade (vert) ou spéculatif (rouge), avec la perspective en dessous. */
  .mkt-cap{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);margin-top:14px;margin-bottom:6px;}
  .ratings{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);}
  .rating{flex:1;background:var(--panel);padding:10px 6px;text-align:center;}
  .rk{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);}
  .rg{font-family:var(--display);font-weight:600;font-size:19px;margin-top:4px;letter-spacing:-.01em;line-height:1;}
  .rg.ig{color:#1E7A46;} .rg.spec{color:#B4462A;} .rg.none{color:var(--dim);font-size:16px;}
  .ro{font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;text-transform:uppercase;margin-top:4px;}
  .ro-positive{color:#1E7A46;} .ro-negative{color:#B4462A;} .ro-stable{color:var(--dim);}
  /* Devise & change */
  .fx-line{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:var(--dim);margin-top:7px;}
  .fx-line b{color:var(--ink);font-weight:600;}
  .fx-pair{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--dim);margin-top:11px;}
  .fx-loading{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;padding:12px 2px;}
  /* Convertisseur : montant + bascule €/$ + résultat en devise locale */
  .fx-conv{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .fx-row{display:flex;align-items:center;gap:8px;min-height:32px;}
  .fx-in{width:104px;background:var(--paper);border:1px solid var(--rule);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:7px 9px;border-radius:2px;outline:none;
    -moz-appearance:textfield;}
  .fx-in::-webkit-outer-spin-button,.fx-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .fx-in:focus{border-color:var(--indigo);}
  .fx-tog{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:2px;overflow:hidden;}
  .fx-cur{background:var(--panel);color:var(--dim);border:0;font-family:var(--mono);font-size:13px;
    padding:6px 11px;cursor:pointer;line-height:1.4;}
  .fx-cur:hover:not(.on){color:var(--ink);}
  .fx-cur.on{background:var(--indigo);color:#FFF;}
  .fx-eq{font-family:var(--mono);font-size:13px;color:var(--dim);}
  .fx-eq b{color:var(--ink);font-weight:600;}
  .fx-unit{font-family:var(--mono);font-size:13px;color:var(--dim);}
  .fx-swap{background:var(--paper);border:1px solid var(--rule);color:var(--dim);border-radius:2px;
    font-size:14px;line-height:1;padding:6px 8px;cursor:pointer;}
  .fx-swap:hover{color:var(--ink);border-color:var(--indigo);}

  /* ── Onglets de navigation ── */
  .tabs{display:flex;gap:2px;flex:none;padding:0 10px;background:var(--panel);
    border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
    padding:12px 13px;cursor:pointer;white-space:nowrap;line-height:1;}
  .tabs button:hover{color:var(--ink);}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--indigo);}

  /* ── Conteneurs de vue ── */
  .view{flex:1;min-height:0;display:flex;flex-direction:column;}
  .view[hidden]{display:none;}
  .page{flex:1;min-height:0;overflow-y:auto;padding:34px 28px 56px;}
  .page-in{max-width:760px;margin:0 auto;}
  .page h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;
    margin:0 0 6px;color:var(--ink);}
  .page .lead{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 26px;max-width:640px;}
  .page h2{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);}
  .page p.body{color:var(--ink);font-size:14.5px;line-height:1.7;margin:0 0 16px;}
  /* Profil (page But) */
  .about-head{display:flex;gap:22px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .about-id h1{margin:0 0 5px;}
  .about-role{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:10px;}
  .about-link{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--indigo);text-decoration:none;
    border:1px solid var(--rule);border-radius:2px;padding:5px 11px;}
  .about-link:hover{border-color:var(--indigo);background:var(--rule-soft);}
  /* Formulaire de feedback */
  .fb-form{display:flex;flex-direction:column;gap:10px;max-width:480px;margin-top:4px;}
  .fb-form input,.fb-form textarea{background:var(--paper);border:1px solid var(--rule);
    color:var(--ink);font-family:var(--body);font-size:14px;padding:10px 12px;border-radius:3px;
    outline:none;width:100%;box-sizing:border-box;resize:vertical;}
  .fb-form input::placeholder,.fb-form textarea::placeholder{color:var(--dim);}
  .fb-form input:focus,.fb-form textarea:focus{border-color:var(--indigo);}
  .fb-btn{align-self:flex-start;background:var(--indigo);color:#FFF;border:0;border-radius:3px;
    font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    padding:10px 20px;cursor:pointer;}
  .fb-btn:hover{background:var(--indigo-hi);}
  .fb-btn:disabled{opacity:.6;cursor:default;}
  .fb-status{font-family:var(--mono);font-size:12px;color:var(--dim);min-height:16px;}
  /* Lexique */
  .lex{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);}
  .lex-item{background:var(--panel);padding:13px 16px;}
  .lex-term{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);}
  .lex-term small{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--dim);
    text-transform:uppercase;letter-spacing:.05em;margin-left:8px;}
  .lex-def{color:var(--dim);font-size:13px;line-height:1.55;margin-top:3px;}
  /* Base de données */
  .src{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);}
  .src-item{background:var(--panel);padding:14px 16px;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:baseline;}
  .src-name{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);}
  .src-freq{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--indigo);border:1px solid var(--rule);border-radius:2px;padding:2px 7px;}
  .src-desc{color:var(--dim);font-size:13px;line-height:1.55;flex-basis:100%;}
  /* Placeholder (comparaison, jeux) */
  .soon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px;gap:12px;}
  .soon .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--indigo);border:1px solid var(--rule);border-radius:2px;padding:4px 10px;}
  .soon h1{font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);margin:0;letter-spacing:-.02em;}
  .soon p{color:var(--dim);font-size:14px;line-height:1.65;max-width:460px;margin:0;}
  /* Base de données : tableur */
  .db-page{display:flex;flex-direction:column;overflow:hidden;padding:14px 22px 12px;}
  .db-page h1{font-size:19px;margin:0 0 3px;}
  .db-page .lead{font-size:12.5px;margin:0 0 10px;max-width:none;}
  .db-in{display:flex;flex-direction:column;min-height:0;flex:1;max-width:100%;}
  .db-cols{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px;align-items:center;}
  .db-chk{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
    letter-spacing:.03em;text-transform:uppercase;color:var(--dim);cursor:pointer;}
  .db-chk input{accent-color:var(--indigo);cursor:pointer;margin:0;}
  .db-all{background:var(--indigo);color:#FFF;border:0;border-radius:3px;font-family:var(--mono);
    font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;cursor:pointer;}
  .db-all:hover{background:var(--indigo-hi);}
  .db-search{font-family:var(--body);font-size:13px;width:230px;max-width:100%;padding:6px 11px;
    margin:0 0 8px;background:var(--paper);border:1px solid var(--rule);border-radius:3px;
    color:var(--ink);outline:none;box-sizing:border-box;}
  .db-search:focus{border-color:var(--indigo);}
  .db-search::placeholder{color:var(--dim);}
  .db-none{color:var(--dim);text-align:center;padding:18px;}
  .db-src{margin-top:7px;flex:none;}
  .pickcell{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .pickcell input{accent-color:var(--indigo);cursor:pointer;margin:0;flex:none;}
  table.db tr.picked td{background:var(--rule-soft);}
  table.db tr.picked td:first-child{background:var(--panel);box-shadow:inset 3px 0 0 var(--indigo);}
  /* Filtres du tableur */
  .db-filters{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 8px;}
  .fgroup{display:flex;align-items:center;flex-wrap:wrap;gap:5px;}
  .flab{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);margin-right:4px;cursor:default;}
  .fsep{color:var(--dim);font-size:11px;margin:0 2px;}
  .chip{background:var(--paper);border:1px solid var(--rule);border-radius:20px;color:var(--dim);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:4px 11px;cursor:pointer;
    line-height:1;transition:background .12s ease,color .12s ease,border-color .12s ease;}
  .chip:hover{color:var(--ink);border-color:var(--indigo);}
  .chip.on{background:var(--indigo);border-color:var(--indigo);color:#FFF;}
  .chip:disabled{opacity:.4;cursor:default;}
  .chip:disabled:hover{color:var(--dim);border-color:var(--rule);}
  /* Jeu : trouve le pays */
  .g-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;}
  .g-searchwrap{position:relative;}
  .g-in{font-family:var(--body);font-size:13px;width:240px;max-width:100%;padding:7px 11px;
    background:var(--paper);border:1px solid var(--rule);border-radius:3px;color:var(--ink);
    outline:none;box-sizing:border-box;}
  .g-in:focus{border-color:var(--indigo);}
  .g-in::placeholder{color:var(--dim);}
  .g-sug{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:30;background:var(--panel);
    border:1px solid var(--rule);box-shadow:0 4px 14px rgba(0,0,0,.14);}
  .g-sug:empty{display:none;}
  .g-sug button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    font-family:var(--body);font-size:13px;color:var(--ink);padding:8px 11px;}
  .g-sug button:hover{background:var(--rule-soft);}
  .g-count{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);}
  .g-banner{background:#1E7A46;color:#FFF;font-size:14px;font-weight:600;padding:10px 18px;
    border-radius:var(--r-s);margin:0 auto 10px;max-width:480px;width:fit-content;
    box-shadow:0 6px 20px rgba(30,122,70,.3);}
  .g-scroll{overflow:auto;flex:1;min-height:0;}
  .g-row{display:grid;grid-template-columns:minmax(130px,1.4fr) repeat(6,minmax(96px,1fr));gap:6px;margin-bottom:6px;}
  .g-head .g-cell{background:none;border:0;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--dim);padding:2px 4px;min-height:0;}
  .g-cell{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:9px 8px;
    font-size:12.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;
    text-align:center;min-height:38px;font-variant-numeric:tabular-nums;line-height:1.25;}
  .g-name{font-weight:600;justify-content:flex-start;text-align:left;}
  .g-cell.g-ok{background:#1E7A46;border-color:#1E7A46;color:#FFF;}
  .g-cell.g-close{background:#C9921E;border-color:#C9921E;color:#FFF;}
  .g-empty{color:var(--dim);font-size:13px;padding:14px 2px;}
  .g-dir{font-size:19px;color:var(--indigo);}
  .g-dir.g-ok{color:#FFF;font-size:15px;}
  .g-hintbox{margin:0 0 10px;font-size:13.5px;color:var(--ink);}
  .g-hintbox b{font-family:var(--mono);color:var(--indigo);letter-spacing:.05em;}
  .g-hintwait{color:var(--dim);font-size:12.5px;}
  /* Vue jeu : colonne centrée, largeur bornée */
  .g-center{max-width:940px;margin:0 auto;width:100%;}
  .g-page h1,.g-page .lead{text-align:center;}
  .g-page .lead{max-width:680px;margin:0 auto 18px;font-size:14px;line-height:1.65;}
  .g-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--indigo);text-align:center;margin:14px 0 6px;}
  .g-page .g-title{font-size:34px;margin:0 0 12px;letter-spacing:-.02em;}
  .g-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 20px;margin:0 0 24px;}
  .g-leg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);}
  .g-leg .sw{width:24px;height:24px;border-radius:3px;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-style:normal;flex:none;
    background:var(--panel);border:1px solid var(--rule);color:var(--ink);}
  .g-leg .sw.g-ok{background:#1E7A46;border-color:#1E7A46;color:#FFF;}
  .g-leg .sw.g-close{background:#C9921E;border-color:#C9921E;color:#FFF;}
  .g-leg .sw.g-swdir{color:var(--indigo);font-size:15px;}
  .g-bar{justify-content:center;margin-bottom:16px;}
  .g-banner,.g-hintbox{text-align:center;}
  /* Hub des jeux */
  /* Les pages de jeux défilent d'un bloc dans la fenêtre (elles n'héritent pas
     du overflow:hidden de .db-page). Le tableau des essais s'étend au lieu
     d'être enfermé dans une bande à défilement propre ; il ne conserve qu'un
     défilement horizontal si la largeur l'exige. */
  .page.g-page{position:relative;display:block;overflow-y:auto;overflow-x:hidden;padding:14px 22px 44px;}
  .g-page .db-in{display:block;flex:none;min-height:0;}
  .g-page .g-scroll{overflow-x:auto;overflow-y:hidden;flex:none;min-height:0;}
  .g-back{position:absolute;top:16px;left:22px;background:none;border:0;color:var(--dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;padding:4px 0;z-index:2;}
  .g-back:hover{color:var(--indigo);}
  .serie-card{border:1px solid var(--indigo);border-radius:4px;background:var(--panel);
    text-align:center;padding:26px 22px;margin:6px 0 18px;
    box-shadow:0 2px 14px rgba(36,53,124,.08);}
  .serie-badge{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--indigo);margin-bottom:8px;}
  .serie-t{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;
    color:var(--ink);margin-bottom:8px;}
  .serie-d{color:var(--dim);font-size:13.5px;line-height:1.6;max-width:560px;margin:0 auto 16px;}
  .serie-play{font-size:12px;padding:11px 22px;}
  .serie-done{color:#1E7A46;font-weight:600;font-size:14px;margin-bottom:10px;}
  .g-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.g-grid{grid-template-columns:1fr;}}
  .g-card{border:1px solid var(--rule);border-radius:4px;background:var(--panel);padding:20px 18px;
    display:flex;flex-direction:column;gap:8px;cursor:pointer;
    transition:border-color .15s ease,transform .15s ease;}
  .g-card:hover{border-color:var(--indigo);}
  .g-card.off{cursor:default;opacity:.55;}
  .g-card.off:hover{border-color:var(--rule);transform:none;}
  .g-card-t{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);}
  .g-card-d{color:var(--dim);font-size:13px;line-height:1.55;flex:1;}
  .tagmini{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:3px 8px;align-self:flex-start;}
  .tagmini.on{color:var(--indigo);border-color:var(--indigo);}
  /* Super Série : étapes linéaires (non cliquables — on ne choisit pas) */
  .serie-prog{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);margin:0 0 12px;}
  .serie-steps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px;}
  .serie-step{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
    background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 14px 10px 12px;
    min-width:150px;position:relative;}
  .serie-step .sr-i{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:10px;
    color:var(--dim);border:1px solid var(--rule);border-radius:50%;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;}
  .serie-step .sr-t{font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--ink);padding-right:22px;}
  .serie-step .sr-s{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--dim);text-transform:uppercase;}
  .serie-step.done{border-color:#1E7A46;}
  .serie-step.done .sr-s{color:#1E7A46;}
  .serie-step.done .sr-i{border-color:#1E7A46;color:#1E7A46;}
  .serie-step.current{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset;}
  .serie-step.current .sr-s{color:var(--indigo);}
  .serie-step.current .sr-i{border-color:var(--indigo);color:var(--indigo);}
  .serie-step.todo{opacity:.6;}
  .serie-cta .serie-play{font-size:12px;padding:11px 24px;}
  .serie-cont{text-align:center;margin:14px 0 4px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  /* Fin de manche : « Jeu suivant → » en LAYER FLOTTANT, fixé en bas à
     droite de la page (au-dessus du pied de page), insensible au scroll —
     identique sur les 4 jeux. */
  .serie-cont.next{position:fixed;right:26px;bottom:58px;z-index:120;height:auto;
    margin:0;padding:0;max-width:none;display:block;}
  .serie-nextbtn{font-size:14px;font-weight:800;letter-spacing:.03em;padding:15px 28px;opacity:0;
    box-shadow:0 10px 30px color-mix(in srgb, var(--indigo) 50%, transparent);
    animation:snext .5s cubic-bezier(.22,.8,.3,1) .45s forwards;}
  @keyframes snext{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @media(max-width:680px){ .serie-cont.next{right:14px;bottom:52px;} }
  @media(prefers-reduced-motion:reduce){ .serie-nextbtn{animation:none;opacity:1;} }
  /* Pop-up de fin de série : récap du score + classement du jour. */
  .sp-emoji{font-size:38px;text-align:center;margin:2px 0 6px;}
  .sp-lines{display:flex;flex-direction:column;gap:7px;margin:16px 0 0;}
  .sp-line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--dim);
    border-bottom:1px solid var(--rule-soft);padding-bottom:7px;}
  .sp-line b{color:var(--ink);font-family:var(--mono);font-weight:600;}
  .sp-total{display:flex;justify-content:space-between;gap:12px;margin:12px 0 0;
    font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);}
  .sp-total b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sp-rank{margin:16px 0 2px;text-align:center;font-size:13.5px;color:var(--dim);
    background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-s);padding:11px 12px;}
  .sp-rank b{color:var(--indigo);font-family:var(--mono);}
  .serie-free{text-align:center;color:var(--dim);font-size:12.5px;margin:2px 0 12px;}
  /* ── Accueil (landing) ─────────────────────────────────────────────── */
  .home-page{display:block;overflow-y:auto;overflow-x:hidden;height:100%;padding:0 22px 60px;
    scroll-behavior:smooth;}
  .hero{min-height:66vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;padding:40px 0 30px;}
  .hero-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--indigo);margin-bottom:14px;}
  .hero-t{font-family:var(--display);font-weight:800;font-size:clamp(52px,9vw,96px);letter-spacing:-.03em;
    line-height:1;margin:0 0 18px;color:var(--ink);}
  .hero-d{max-width:560px;color:var(--dim);font-size:16px;line-height:1.6;margin:0 0 26px;}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .hs-cta{background:var(--indigo);color:#FFF;border:0;border-radius:3px;cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:11px 20px;
    transition:transform .15s ease,background .15s ease;}
  .hs-cta:hover{filter:brightness(1.06);}
  .hs-cta.big{font-size:13px;padding:13px 26px;}
  .hs-cta.ghost{background:none;color:var(--indigo);border:1px solid var(--indigo);}
  .hs-cta.ghost:hover{background:var(--ocean);}
  .hero-cue{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:var(--dim);
    font-size:18px;animation:hcue 1.6s ease-in-out infinite;}
  @keyframes hcue{0%,100%{transform:translate(-50%,0);opacity:.5;}50%{transform:translate(-50%,8px);opacity:1;}}
  .home-foot{text-align:center;padding:40px 0 20px;}
  /* Apparition au scroll */
  .reveal{opacity:0;transform:translateY(30px);filter:blur(6px);
    transition:opacity .8s cubic-bezier(.22,.8,.3,1),transform .8s cubic-bezier(.22,.8,.3,1),filter .8s ease;}
  .reveal.vis{opacity:1;transform:none;filter:none;}
  .reveal.vis.instant{transition:none;}
  @media(max-width:720px){
    }
  /* Vignettes animées */
  @media(prefers-reduced-motion:reduce){
    .hero-cue{animation:none;}
      .reveal{opacity:1;transform:none;filter:none;transition:none;}
  }
  /* ── Onglet FX / Devises : convertisseur fixe à gauche, liste à droite ── */
  /* La page FX ne défile pas : en-tête et convertisseur restent en place,
     SEULE la liste de droite a son propre défilement. */
  .page.fx-page{display:flex;flex-direction:column;overflow:hidden;}
  .fx-page .db-in{display:flex;flex-direction:column;flex:1;min-height:0;}
  .fxv-grid{display:flex;gap:22px;align-items:flex-start;max-width:880px;margin:10px auto 0;width:100%;
    flex:1;min-height:0;}
  /* Convertisseur : même hauteur que la liste (bas alignés), source en pied. */
  .fxv-left{flex:0 0 300px;align-self:stretch;display:flex;}
  .fxv-card{flex:1;gap:14px;}
  .fxv-card .m-in,.fxv-card .m-sel{padding-top:11px;padding-bottom:11px;}
  .fxv-swapbtn{width:38px;height:34px;}
  .fxv-res b{font-size:21px;}
  .fxv-clk{cursor:pointer;}
  .fxv-clk:hover td,.fxv-clk:focus-visible td{background:color-mix(in srgb, var(--indigo) 8%, var(--panel));}
  .fxv-clk:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px;}
  .fxv-rightwrap{flex:1;min-width:0;align-self:stretch;position:relative;display:flex;}
  .fxv-right{flex:1;min-width:0;overflow-y:auto;padding-bottom:8px;
    scrollbar-width:none;}
  .fxv-right::-webkit-scrollbar{display:none;}
  /* Flèche « on peut défiler », en bas à droite de la liste. */
  .fxv-cue{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--rule);box-shadow:var(--elev1);color:var(--indigo);
    display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none;
    animation:fcue 1.6s ease-in-out infinite;transition:opacity .25s ease;}
  @keyframes fcue{0%,100%{transform:translateY(0);opacity:.65;}50%{transform:translateY(5px);opacity:1;}}
  .fxv-cue.hide{opacity:0;animation:none;}
  .fxv-card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-m);
    box-shadow:var(--elev1);padding:18px 18px 26px;display:flex;flex-direction:column;gap:11px;text-align:left;}
  .fxv-h{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);}
  .fxv-amt{width:100%;text-align:right;font-size:16px;}
  .fxv-sel{width:100%;max-width:none;}
  .fxv-swapbtn{align-self:center;width:34px;height:30px;}
  .fxv-res{font-size:15px;color:var(--dim);text-align:center;margin-top:auto;padding-top:10px;}
  .fxv-card .macro-src{text-align:center;margin-top:14px;}
  .fxv-res b{color:var(--ink);font-family:var(--mono);font-weight:600;font-size:18px;}
  .fxv-unit{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--dim);margin:0;}
  .fxv-table{margin:0;max-width:none;}
  /* Hauts alignés : l'en-tête du tableau est collant dans sa colonne. */
  .fxv-table thead th{position:sticky;top:0;background:var(--panel);z-index:1;}
  @media(max-width:680px){
    .page.fx-page{overflow-y:auto;}
    .fxv-grid{flex-direction:column;flex:none;}
    .fxv-left{position:static;flex:1 1 auto;width:100%;align-self:auto;}
    .fxv-rightwrap{align-self:auto;display:block;}
    .fxv-right{overflow:visible;}
    .fxv-cue{display:none;}
  }
  .fxv-table{width:100%;max-width:640px;margin:0;border-collapse:collapse;font-size:13.5px;}
  .fxv-table th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);font-weight:400;text-align:left;padding:0 10px 8px;border-bottom:1px solid var(--rule);}
  .fxv-table td{padding:8px 10px;border-bottom:1px solid var(--rule-soft);color:var(--ink);}
  .fxv-table tbody tr:hover{background:var(--ocean);}
  .fxv-table .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .fxv-code{font-family:var(--mono);font-weight:600;color:var(--indigo);}
  /* Jeu « Duel » : deux grandes cartes cliquables face à face. */
  .dl-metric{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--indigo);text-align:center;margin:2px 0 16px;}
  .dl-arena{display:flex;align-items:stretch;justify-content:center;gap:16px;margin:0 0 18px;}
  .dl-side{flex:0 1 240px;display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-m);
    padding:20px 16px;cursor:pointer;box-shadow:var(--elev1);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
  .dl-side:hover:not(:disabled){transform:translateY(-3px);box-shadow:var(--elev2);border-color:var(--indigo);}
  .dl-side:active:not(:disabled){transform:scale(.98);}
  .dl-side:disabled{cursor:default;opacity:.92;}
  .dl-side.wrong{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent),var(--elev1);
    animation:dshake .3s ease;}
  .dl-side.right{border-color:#1E7A46;
    box-shadow:0 0 0 3px rgba(30,122,70,.35),0 10px 26px rgba(30,122,70,.25);}
  .dl-side{position:relative;}
  .dl-mark{position:absolute;top:8px;right:10px;font-weight:800;font-size:18px;}
  .dl-mark.ok{color:#1E7A46;}
  .dl-mark.ko{color:var(--accent);}
  @keyframes dshake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .dl-flag{width:84px;aspect-ratio:4/3;object-fit:cover;border-radius:6px;
    border:1px solid var(--rule);box-shadow:0 4px 12px rgba(19,26,46,.16);}
  .dl-name{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);text-align:center;}
  .dl-val{font-family:var(--mono);font-size:13px;color:var(--teal);}
  .dl-vs{align-self:center;font-family:var(--display);font-weight:800;font-size:18px;
    color:var(--dim);letter-spacing:.04em;}
  @media(max-width:560px){ .dl-arena{flex-direction:column;align-items:center;} .dl-vs{margin:-4px 0;} }
  /* Jeu « Podium » : trois marches à remplir. */
  .pd-cat{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--indigo);text-align:center;margin:2px 0 14px;}
  .pd-slots{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto 18px;width:100%;}
  .pd-slot{display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px dashed var(--rule);border-radius:var(--r-s);padding:11px 14px;}
  .pd-slot.got{border-style:solid;border-color:#1E7A46;animation:ppop .3s ease;}
  @keyframes ppop{from{transform:scale(.96);opacity:.5;}to{transform:scale(1);opacity:1;}}
  .pd-medal{font-size:18px;flex:none;}
  .pd-name{font-weight:600;color:var(--ink);flex:1;}
  .pd-name.dim{color:var(--dim);font-weight:400;}
  .pd-val{font-family:var(--mono);font-size:12.5px;color:var(--teal);}
  .pd-rank{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--indigo);}
  /* Duel quotidien : les 8 en liste, révélation unique après validation. */
  .dr-list{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto 18px;width:100%;}
  .dr-row{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-m);
    padding:12px 14px;box-shadow:var(--elev1);}
  .dr-row.ok{border-color:#1E7A46;}
  .dr-row.ko{border-color:var(--accent);}
  .dr-meta{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .dr-n{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--rule);
    border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;flex:none;}
  .dr-met{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--indigo);}
  .dr-duel{display:flex;align-items:stretch;gap:8px;}
  .dr-vs{align-self:center;font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;}
  .dr-side{flex:1;min-width:0;display:flex;align-items:center;gap:9px;position:relative;
    background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-s);
    padding:9px 30px 9px 10px;cursor:pointer;text-align:left;
    transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease;}
  .dr-side:hover:not(:disabled){border-color:var(--indigo);transform:translateY(-1px);}
  .dr-side:disabled{cursor:default;}
  .dr-side.sel{border-color:var(--indigo);box-shadow:0 0 0 2px color-mix(in srgb, var(--indigo) 30%, transparent);
    background:color-mix(in srgb, var(--indigo) 8%, var(--paper));}
  .dr-side.right{border-color:#1E7A46;box-shadow:0 0 0 2px rgba(30,122,70,.35);
    background:color-mix(in srgb, #1E7A46 9%, var(--paper));}
  .dr-side.wrong{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);}
  .dr-flag{width:34px;aspect-ratio:4/3;object-fit:cover;border-radius:3px;border:1px solid var(--rule);flex:none;}
  .dr-name{font-weight:600;font-size:13.5px;color:var(--ink);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dr-val{font-family:var(--mono);font-size:11.5px;color:var(--teal);flex:none;}
  .dr-side .dl-mark{top:50%;transform:translateY(-50%);right:8px;font-size:15px;}
  .hs-cta:disabled{opacity:.45;cursor:default;transform:none!important;box-shadow:none!important;}
  @media(max-width:560px){ .dr-duel{flex-direction:column;} .dr-vs{align-self:center;} }
  /* ── Salle de jeux : cartes animées ─────────────────────────────────── */
  /* Entrée en cascade des cartes et de la rangée série. */
  @keyframes gcIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  #view-games .serie-row{animation:gcIn .45s cubic-bezier(.22,.8,.3,1) both;}
  #view-games .g-grid .g-card{animation:gcIn .45s cubic-bezier(.22,.8,.3,1) both;}
  #view-games .g-grid .g-card:nth-child(1){animation-delay:.08s;}
  #view-games .g-grid .g-card:nth-child(2){animation-delay:.16s;}
  #view-games .g-grid .g-card:nth-child(3){animation-delay:.24s;}
  #view-games .g-grid .g-card:nth-child(4){animation-delay:.32s;}
  /* Étape courante de la série : halo qui respire. */
  @keyframes stepGlow{0%,100%{box-shadow:0 0 0 1px var(--indigo) inset;}
    50%{box-shadow:0 0 0 1px var(--indigo) inset,0 0 16px color-mix(in srgb, var(--indigo) 45%, transparent);}}
  .serie-step.current{animation:stepGlow 2.4s ease-in-out infinite;}
  /* Vignette commune des cartes. */
  .gc-viz{height:64px;display:flex;align-items:center;justify-content:center;gap:10px;
    margin:2px 0 12px;position:relative;}
  .g-card:hover .gc-viz{transform:scale(1.07);}
  .gc-viz{transition:transform .25s ease;}
  /* 1 — Trouve le pays : mini-carte réelle + balayage radar. */
  .gc-radar{position:relative;width:150px;height:76px;border-radius:8px;overflow:hidden;
    background:var(--ocean);border:1px solid var(--rule);}
  .gc-map{display:block;}
  .gc-sweep{position:absolute;inset:-40%;background:conic-gradient(from 0deg,
    transparent 0 78%, color-mix(in srgb, var(--indigo) 55%, transparent) 92%, transparent 100%);
    animation:gsweep 3.2s linear infinite;}
  @keyframes gsweep{to{transform:rotate(360deg);}}
  .gc-ping{position:absolute;left:62%;top:38%;width:6px;height:6px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
    animation:gping 2.1s ease-out infinite;}
  @keyframes gping{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);}
    70%{box-shadow:0 0 0 11px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
  /* 2 — Drapeau : éventail de vrais drapeaux qui s'ouvre au survol. */
  .gc-fan{position:relative;width:120px;}
  .gc-fanflag{width:56px;aspect-ratio:4/3;object-fit:cover;border-radius:5px;position:absolute;
    left:50%;top:50%;border:1px solid var(--rule);box-shadow:0 6px 16px rgba(19,26,46,.28);
    transition:transform .35s cubic-bezier(.22,.8,.3,1);}
  .gc-fanflag.f1{transform:translate(-50%,-50%) rotate(-10deg) translateX(-14px);}
  .gc-fanflag.f2{transform:translate(-50%,-50%) rotate(0deg);z-index:1;}
  .gc-fanflag.f3{transform:translate(-50%,-50%) rotate(10deg) translateX(14px);}
  .g-card:hover .gc-fanflag.f1{transform:translate(-50%,-50%) rotate(-18deg) translateX(-26px) translateY(-4px);}
  .g-card:hover .gc-fanflag.f2{transform:translate(-50%,-50%) translateY(-8px);}
  .g-card:hover .gc-fanflag.f3{transform:translate(-50%,-50%) rotate(18deg) translateX(26px) translateY(-4px);}
  .gf-q{position:absolute;right:6px;top:-8px;width:22px;height:22px;border-radius:50%;z-index:2;
    background:var(--accent);color:#FFF;font-family:var(--mono);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.25);
    animation:gfQ 1.9s ease-in-out infinite;}
  @keyframes gfQ{0%,100%{transform:translateY(0);}45%{transform:translateY(-7px) rotate(8deg);}}
  /* 3 — Duel : deux vrais drapeaux, corde en tir à la corde. */
  .gc-duel{gap:10px;}
  .gc-duelflag{width:46px;aspect-ratio:4/3;object-fit:cover;border-radius:5px;
    border:1px solid var(--rule);box-shadow:0 5px 14px rgba(19,26,46,.24);}
  .gc-duelflag.da{animation:gtiltA 2.6s ease-in-out infinite;}
  .gc-duelflag.db2{animation:gtiltB 2.6s ease-in-out infinite;}
  @keyframes gtiltA{0%,100%{transform:rotate(-4deg) translateY(0);}50%{transform:rotate(2deg) translateY(-3px);}}
  @keyframes gtiltB{0%,100%{transform:rotate(4deg) translateY(-3px);}50%{transform:rotate(-2deg) translateY(0);}}
  .gd-tug{width:44px;height:5px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden;}
  .gd-tug i{position:absolute;inset:0;border-radius:3px;background:var(--grad);
    animation:gtug 2.6s ease-in-out infinite;}
  @keyframes gtug{0%,100%{transform:translateX(-26%);}50%{transform:translateX(26%);}}
  /* 4 — Podium : marches qui montent, vrais drapeaux du top PIB. */
  .gc-podium{gap:5px;align-items:flex-end;}
  .gp-step{width:34px;border-radius:5px 5px 0 0;background:var(--panel);border:1px solid var(--rule);
    border-bottom:0;position:relative;animation:gpRise .6s cubic-bezier(.22,.8,.3,1) both;}
  .gp-step.s1{height:44px;background:color-mix(in srgb, var(--indigo) 14%, var(--panel));
    border-color:var(--indigo);animation-delay:.25s;}
  .gp-step.s2{height:32px;animation-delay:.1s;}
  .gp-step.s3{height:22px;animation-delay:.4s;}
  @keyframes gpRise{from{transform:scaleY(0);transform-origin:bottom;}to{transform:scaleY(1);transform-origin:bottom;}}
  .gp-flag{position:absolute;top:-15px;left:50%;width:26px;aspect-ratio:4/3;object-fit:cover;
    border-radius:3px;border:1px solid var(--rule);box-shadow:0 4px 10px rgba(19,26,46,.25);
    animation:gpFloat 2.4s ease-in-out infinite;}
  .gp-step.s2 .gp-flag{animation-delay:.3s;} .gp-step.s3 .gp-flag{animation-delay:.6s;}
  @keyframes gpFloat{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-4px);}}
  /* ── Hero : globe canvas + reflet des cartes inclinables ─────────────── */
  #heroGlobe{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);z-index:-1;
    opacity:.5;cursor:grab;touch-action:none;}
  #heroGlobe:active{cursor:grabbing;}
  :root[data-theme="dark"] #heroGlobe{opacity:.62;}
  .hero-inner{position:relative;display:flex;flex-direction:column;align-items:center;
    pointer-events:none;}
  .hero-inner .hero-ctas,.hero-inner button{pointer-events:auto;}
  .hero-t{text-shadow:0 2px 30px color-mix(in srgb, var(--paper) 70%, transparent);}
  /* .tiltable ne bouge plus : seul le halo suit la souris (via --gx/--gy). */
  .tiltable{position:relative;transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;}
  .tiltable::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),
      color-mix(in srgb, #FFFFFF 14%, transparent), transparent 70%);
    opacity:0;transition:opacity .25s ease;}
  .tiltable:hover::after{opacity:1;}
  @media(prefers-reduced-motion:reduce){
    #view-games .serie-row,#view-games .g-grid .g-card,.gp-step{animation:none;}
    .serie-step.current{animation:none;box-shadow:0 0 0 1px var(--indigo) inset;}
    .g-card:hover .gc-viz{transform:none;}
    .gc-sweep,.gc-ping,.gf-q,.gc-duelflag.da,.gc-duelflag.db2,.gd-tug i,.gp-flag{animation:none;}
    .tiltable::after{display:none;}
    #heroGlobe{display:none;}
  }
  /* Super Série : bordure lumineuse qui parcourt le cadre — le contenu (et
     ses boutons) ne bouge pas d'un pixel. Un simple rotate GPU, très léger. */
  .serie-glow{position:relative;overflow:hidden;border-color:transparent;}
  .serie-glow::before{content:"";position:absolute;inset:-120%;z-index:0;
    background:conic-gradient(transparent 0deg 265deg,
      color-mix(in srgb, var(--indigo) 85%, transparent) 305deg,
      color-mix(in srgb, var(--teal) 85%, transparent) 340deg, transparent 360deg);
    animation:sglow 5.5s linear infinite;}
  @keyframes sglow{to{transform:rotate(360deg);}}
  .serie-glow::after{content:"";position:absolute;inset:1px;z-index:0;
    background:var(--panel);border-radius:calc(var(--r-m) - 1px);}
  .serie-glow > *{position:relative;z-index:1;}
  @media(prefers-reduced-motion:reduce){ .serie-glow::before{animation:none;} .serie-glow{border-color:var(--indigo);} }
  /* Landing : kickers de sections + sections un peu plus denses */
  /* ── Bento : la vitrine des sections, en aperçus réels ─────────────── */
  .hero-stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px;
    animation:heroUp .7s ease both .48s;pointer-events:none;}
  .hchip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;
    padding:12px 18px;border:1px solid var(--rule);border-radius:var(--r-m);
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .hchip b{font-family:var(--display);font-weight:800;font-size:20px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hchip span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .bento{display:grid;grid-template-columns:repeat(3, 1fr);grid-auto-rows:minmax(150px, auto);
    gap:16px;max-width:1020px;margin:10px auto 30px;width:100%;
    grid-template-areas:"map map db" "fx games db" "refs but but";}
  .b-map{grid-area:map;} .b-db{grid-area:db;} .b-fx{grid-area:fx;}
  .b-games{grid-area:games;} .b-refs{grid-area:refs;} .b-but{grid-area:but;}
  .bento-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;height:100%;box-sizing:border-box;
    background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-l);
    padding:22px 22px 18px;cursor:pointer;box-shadow:var(--elev1);position:relative;overflow:hidden;
    font-family:var(--body);color:var(--ink);
    transition:box-shadow .25s ease,border-color .25s ease;}
  .bento-card:hover{box-shadow:var(--elev2);border-color:color-mix(in srgb, var(--indigo) 55%, var(--rule));
    background:color-mix(in srgb, var(--indigo) 4%, var(--panel));}
  .bc-head{display:flex;align-items:center;gap:8px;}
  .bc-n{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--rule);
    border-radius:999px;padding:3px 8px;}
  .bc-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bc-t{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0;}
  .bc-d{font-size:13px;line-height:1.55;color:var(--dim);margin:0;}
  .bc-go{margin-top:auto;padding-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--indigo);opacity:0;transform:translateY(4px);
    transition:opacity .22s ease,transform .22s ease;display:flex;align-items:center;gap:6px;}
  .bc-go i{font-style:normal;transition:transform .22s ease;}
  .bento-card:hover .bc-go{opacity:1;transform:none;}
  .bento-card:hover .bc-go i{transform:translateX(4px);}
  /* Aperçus */
  .bm-wrap{position:relative;width:100%;border-radius:var(--r-s);overflow:hidden;
    background:var(--ocean);border:1px solid var(--rule);margin-top:4px;}
  .bm-canvas{display:block;width:100%;}
  .bm-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);}
  .bm-dot.d2{background:var(--indigo);box-shadow:0 0 0 4px color-mix(in srgb, var(--indigo) 18%, transparent);}
  .bm-dot.d3{background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb, var(--teal) 18%, transparent);}
  .bdb{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .b-db .bdb{flex:1;}
  .b-db .bdb-row{flex:1;min-height:32px;}
  .bdb-row{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule-soft);
    border-radius:var(--r-s);padding:8px 12px;font-size:12.5px;}
  .bdb-row .r{font-family:var(--mono);font-size:10px;color:var(--indigo);width:14px;}
  .bdb-row .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bdb-row .v{font-family:var(--mono);font-size:11.5px;color:var(--teal);}
  .bdb-row.skel .n{height:10px;background:var(--rule-soft);border-radius:3px;}
  .bdb-row.skel .v{width:52px;height:10px;background:var(--rule-soft);border-radius:3px;}
  .bdb-more{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
    color:var(--dim);padding:6px 0 2px;}
  .bfx{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .bfx-pair{display:flex;justify-content:space-between;align-items:center;background:var(--paper);
    border:1px solid var(--rule-soft);border-radius:var(--r-s);padding:8px 12px;font-size:12.5px;}
  .bfx-pair .p{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .bfx-pair b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .bref{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .brefs{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .b-refs .brefs{flex:1;justify-content:flex-end;}
  .bref-ex{background:var(--paper);border:1px solid var(--rule-soft);border-left:3px solid var(--indigo);
    border-radius:var(--r-s);padding:12px 14px;}
  .bref-term{display:block;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:4px;}
  .bref-def{display:block;font-size:12.5px;line-height:1.55;color:var(--dim);}
  .bref-srclab{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim);}
  .bwhy{width:100%;display:flex;flex-direction:column;margin-top:8px;}
  .b-but .bwhy{flex:1;justify-content:flex-end;}
  .bwhy-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:9px 0;border-top:1px solid var(--rule-soft);}
  .bwhy-row:first-child{border-top:0;}
  .bw-k{font-size:12.5px;color:var(--dim);}
  .bw-v{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink);text-align:right;}
  .bref span{font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--rule);
    border-radius:999px;padding:6px 13px;background:var(--paper);}
  /* Carte jeux : grille 2×2, une tuile illustrée par jeu. */
  .bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px;}
  .bg-tile{display:flex;align-items:center;gap:9px;background:var(--paper);
    border:1px solid var(--rule-soft);border-radius:var(--r-s);padding:9px 11px;
    transition:border-color .2s ease,background .2s ease;}
  .bento-card:hover .bg-tile{border-color:color-mix(in srgb, var(--indigo) 30%, var(--rule));}
  .bg-tile > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--dim);
    text-transform:uppercase;}
  .bt-ico{width:30px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--indigo);}
  .bt-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;}
  .bt-flag img{width:28px;aspect-ratio:4/3;object-fit:cover;border-radius:3px;
    border:1px solid var(--rule);box-shadow:0 2px 6px rgba(19,26,46,.18);}
  .bt-duel{gap:2px;position:relative;}
  .bt-duel img{width:15px;aspect-ratio:4/3;object-fit:cover;border-radius:2px;border:1px solid var(--rule);}
  .bt-duel em{font-family:var(--display);font-weight:800;font-size:8px;color:var(--dim);font-style:normal;}
  .bt-podium{align-items:flex-end;gap:2.5px;}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
  /* ═══════════════════════════════════════════════════════════════════
     REFONTE VISUELLE — « carte marine augmentée ».
     Couche d'habillage en fin de cascade : elle ne change AUCUN
     comportement, seulement l'apparence et le mouvement.
     Signature : canvas aurore (indigo→sarcelle) + graticule, panneaux de
     verre, dégradé --grad sur les éléments actifs. Motion < 400 ms,
     coupée par prefers-reduced-motion.
     ═══════════════════════════════════════════════════════════════════ */
  /* Canvas : aurores + graticule cartographique en fond de tout le site.
     (Les surfaces de tableaux sont opaques : le graticule ne s'y mêle pas.) */
  body{
    background:
      radial-gradient(58% 42% at 12% -6%, color-mix(in srgb, var(--indigo) 13%, transparent), transparent 62%),
      radial-gradient(50% 38% at 96% 4%,  color-mix(in srgb, var(--teal) 10%, transparent), transparent 60%),
      radial-gradient(70% 55% at 50% 112%, color-mix(in srgb, var(--indigo) 8%, transparent), transparent 65%),
      repeating-linear-gradient(0deg,  var(--rule-soft) 0 1px, transparent 1px 84px),
      repeating-linear-gradient(90deg, var(--rule-soft) 0 1px, transparent 1px 84px),
      var(--paper);
  }
  /* Chrome : barre verre dépoli + onglets à pilule glissante. */
  .topbar{background:var(--topbar-bg);backdrop-filter:blur(16px) saturate(1.25);
    -webkit-backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 1px 0 var(--rule-soft);}
  .wordmark{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tabs{background:transparent;border-bottom:1px solid var(--rule-soft);padding:6px 12px;gap:4px;}
  .tabs button{border-bottom:0;border-radius:999px;padding:9px 15px;
    transition:color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease;}
  .tabs button:hover{background:var(--rule-soft);}
  .tabs button.on{color:#FFF;background:var(--grad);box-shadow:0 3px 12px color-mix(in srgb, var(--indigo) 35%, transparent);}
  :root[data-theme="light"] .tabs button.on{color:#FFF;}
  /* Entrée de vue : fondu + légère montée à chaque changement d'onglet. */
  @keyframes vEnter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .view.v-enter{animation:vEnter .34s cubic-bezier(.22,.8,.3,1) both;}
  /* Boutons & contrôles : rayons, élévation au survol, appui tactile. */
  .fx,.lang,.theme,.authbar{border-radius:999px;overflow:hidden;background:var(--glass);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .hs-cta,.m-go,.db-all,.g-back,.serie-play{border-radius:999px;
    transition:box-shadow .18s ease,background .18s ease,color .18s ease,filter .18s ease;}
  .hs-cta:hover,.m-go:hover,.serie-play:hover{filter:brightness(1.06);
    box-shadow:0 6px 20px color-mix(in srgb, var(--indigo) 34%, transparent);}
  .hs-cta:active,.m-go:active,.db-all:active,.tabs button:active{filter:brightness(.98);}
  .hs-cta,.m-go,.serie-play{background:var(--grad);}
  .m-in,.m-sel,.g-in,.fx-in,.fxv-amt,.fxv-sel{border-radius:var(--r-s);
    transition:border-color .16s ease,box-shadow .16s ease;}
  .m-in:focus,.m-sel:focus,.g-in:focus,.fx-in:focus,.fxv-amt:focus,.fxv-sel:focus{
    border-color:var(--indigo);box-shadow:0 0 0 3px color-mix(in srgb, var(--indigo) 22%, transparent);outline:none;}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px;}
  /* Cartes & panneaux : verre, rayons larges, ombres douces, hover vivant. */
  .serie-card,.lb-card,.g-card,.fg-cell,.modal-card,.lex-item,.src-item,
  .macro,.results,.reports a{border-radius:var(--r-m);}
  .serie-card,.lb-card,.modal-card{background:var(--glass);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);box-shadow:var(--elev1);}
  .modal-card{box-shadow:var(--elev2);border-radius:var(--r-l);}
  .modal{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  @keyframes mPop{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
  .modal:not([hidden]) .modal-card{animation:mPop .3s cubic-bezier(.22,.8,.3,1) both;}
  .g-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;}
  .g-card:not(.off):hover{box-shadow:var(--elev2);border-color:var(--indigo);
    background:color-mix(in srgb, var(--indigo) 4%, var(--panel));}
  .serie-step,.serie-round,.fg-g{border-radius:var(--r-s);}
  .fg-flag{border-radius:var(--r-m);box-shadow:var(--elev2);}
  .fg-answer{border-radius:var(--r-s);box-shadow:0 8px 24px rgba(30,122,70,.35);}
  /* Tableaux : lignes aérées, survol lavé, en-têtes discrets.
     Surfaces de DONNÉES opaques : les lignes d'un tableur ne doivent jamais
     se mêler au fond — on pose un fond panel plein sous chaque table. */
  .db-scroll{background:var(--panel);border-radius:var(--r-m);}
  table.db th{background:var(--panel);}
  /* Colonnes équilibrées : hors « Pays », chaque colonne se serre sur son
     contenu. Avec peu de colonnes cochées, elles restent groupées côte à
     côte (plus de Région étirée sur un quart d'écran, plus de ligne à
     suivre des yeux d'un bord à l'autre). Avec tout coché : inchangé. */
  table.db th:not(:first-child),table.db td:not(:first-child){width:1%;}
  table.db td:first-child,table.db th:first-child{min-width:190px;}
  /* Zébrage façon tableur : blanc / bleu très pâle assorti à la DA
     (l'équivalent nuit mélange l'indigo au panneau sombre). */
  table.db tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--indigo) 5%, var(--panel));}
  table.db tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb, var(--indigo) 5%, var(--panel));}
  :root[data-theme="dark"] table.db tbody tr:nth-child(even) td,
  :root[data-theme="dark"] table.db tbody tr:nth-child(even) td:first-child{
    background:color-mix(in srgb, var(--indigo) 9%, var(--panel));}
  /* Le survol reste au-dessus du zébrage (déclaré après, il gagne). */
  table.db tbody tr:hover td,
  table.db tbody tr:hover td:first-child{background:color-mix(in srgb, var(--indigo) 11%, var(--panel));}
  :root[data-theme="dark"] table.db tbody tr:hover td,
  :root[data-theme="dark"] table.db tbody tr:hover td:first-child{
    background:color-mix(in srgb, var(--indigo) 16%, var(--panel));}
  .fxv-table{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-m);
    border-collapse:separate;border-spacing:0;overflow:hidden;}
  .fxv-table th{padding-top:10px;}
  .fxv-table th,.fxv-table td{padding-left:14px;padding-right:14px;}
  .lb-card{background:var(--panel);}
  :root[data-theme="dark"] .lb-card{background:var(--panel);}
  .lex-item,.src-item{background:var(--panel);}
  .fxv-table tbody tr,.lb tbody tr{transition:background .15s ease;}

<script type="module">
